<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kagebi MV Renderer</title>
<style>
  @font-face { font-family: 'Shippori'; src: url('../fonts/ShipporiMincho-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Shippori'; src: url('../fonts/ShipporiMincho-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Yuji'; src: url('../fonts/YujiSyuku-Regular.ttf'); }
  body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, FPS = 24, BAR = 100;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });

let FEAT = null, LYR = null;

// ---------- deterministic RNG ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- color helpers ----------
function hex2rgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;
}
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function smoothstep(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }

// ---------- section score (the visual storyboard) ----------
// numeric params are interpolated across section boundaries (2.5 s crossfade)
const SECTIONS = [
  { id:'intro',    t:0.0,   skyTop:'#04050c', skyBot:'#101226', glow:'#ff7a2a', glowI:0.22, mist:0.85, accent:'#8fb4c9', petals:0.0, streaks:0.0, moon:0.35, cold:0.15, ring:0, lantern:0, kanji:'宵' },
  { id:'verse1',   t:13.5,  skyTop:'#060a18', skyBot:'#182240', glow:'#ff8434', glowI:0.34, mist:0.7,  accent:'#9fc3d8', petals:0.0, streaks:0.0, moon:0.85, cold:0.1,  ring:0, lantern:0, kanji:'宵' },
  { id:'chorus1',  t:37.6,  skyTop:'#140b12', skyBot:'#331b23', glow:'#ffa040', glowI:0.72, mist:0.4,  accent:'#ffcf8a', petals:1.0, streaks:0.15,moon:0.4,  cold:0,    ring:0, lantern:0, kanji:'灯' },
  { id:'verse2',   t:50.4,  skyTop:'#0a0e1f', skyBot:'#1f2947', glow:'#ff8434', glowI:0.42, mist:0.6,  accent:'#a8c8da', petals:0.25,streaks:0.0, moon:0.7,  cold:0.05, ring:0, lantern:0, kanji:'祈' },
  { id:'bridgeC',  t:73.8,  skyTop:'#04070f', skyBot:'#102035', glow:'#7ab8ff', glowI:0.3,  mist:0.95, accent:'#bcd9f2', petals:0.0, streaks:0.0, moon:0.95, cold:1,    ring:0, lantern:0, kanji:'魂' },
  { id:'bridgeF',  t:85.5,  skyTop:'#0c0911', skyBot:'#2c1622', glow:'#ff6a1a', glowI:0.62, mist:0.5,  accent:'#ffb37a', petals:0.0, streaks:0.3, moon:0.5,  cold:0,    ring:0, lantern:0, kanji:'魂' },
  { id:'solo1',    t:94.6,  skyTop:'#120a17', skyBot:'#371a2e', glow:'#ff8a30', glowI:0.8,  mist:0.3,  accent:'#ffd9a0', petals:0.45,streaks:0.7, moon:0.3,  cold:0,    ring:1, lantern:0, kanji:'焔' },
  { id:'chorusF',  t:130.6, skyTop:'#1b0c13', skyBot:'#4a2322', glow:'#ffab3d', glowI:0.95, mist:0.25, accent:'#ffe2b0', petals:1.0, streaks:1.0, moon:0.25, cold:0,    ring:0, lantern:0, kanji:'花' },
  { id:'solo2',    t:154.0, skyTop:'#140b19', skyBot:'#3b1a30', glow:'#ff9435', glowI:0.85, mist:0.3,  accent:'#ffd9a0', petals:0.55,streaks:0.85,moon:0.3,  cold:0,    ring:1, lantern:0, kanji:'焔' },
  { id:'outroV',   t:179.2, skyTop:'#0d0811', skyBot:'#271326', glow:'#ff7a2a', glowI:0.72, mist:0.5,  accent:'#ffc890', petals:0.4, streaks:0.2, moon:0.45, cold:0,    ring:0, lantern:1, kanji:'灯' },
  { id:'outroC',   t:210.8, skyTop:'#0a0710', skyBot:'#201122', glow:'#ff8430', glowI:0.8,  mist:0.5,  accent:'#ffc890', petals:0.6, streaks:0.4, moon:0.5,  cold:0,    ring:0, lantern:1, kanji:'灯' },
  { id:'fade',     t:246.0, skyTop:'#050409', skyBot:'#0d0913', glow:'#ff7a2a', glowI:0.4,  mist:0.6,  accent:'#cbb8a8', petals:0.2, streaks:0.0, moon:0.3,  cold:0.1,  ring:0, lantern:1, kanji:'灯' }
];
const XFADE = 2.5;
const NUMKEYS = ['glowI','mist','petals','streaks','moon','cold','ring','lantern'];
const COLKEYS = ['skyTop','skyBot','glow','accent'];

function sectionAt(t) {
  let k = 0;
  for (let i = 0; i < SECTIONS.length; i++) if (t >= SECTIONS[i].t) k = i;
  const cur = SECTIONS[k], prev = SECTIONS[Math.max(0, k - 1)];
  const f = k === 0 ? 1 : smoothstep((t - cur.t) / XFADE);
  const out = { id: cur.id, kanji: cur.kanji, f };
  for (const key of NUMKEYS) out[key] = lerp(prev[key], cur[key], f);
  for (const key of COLKEYS) out[key] = f >= 1 ? cur[key] : lerpHex(prev[key], cur[key], f);
  out.glowHex = f >= 1 ? cur.glow : null;   // raw hexes for particle tinting
  out.glowA = prev.glow; out.glowB = cur.glow;
  out.accA = prev.accent; out.accB = cur.accent;
  return out;
}

// ---------- static scenery (seeded once) ----------
const rng = mulberry32(20260916);
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({ x: rng() * W, y: rng() * H * 0.62, r: 0.6 + rng() * 1.6,
               ph: rng() * Math.PI * 2, sp: 0.4 + rng() * 1.6, a: 0.25 + rng() * 0.6 });
}
const mists = [];
for (let i = 0; i < 11; i++) {
  mists.push({ x: rng() * W, y: H * (0.45 + rng() * 0.5), r: 280 + rng() * 420,
               vx: 6 + rng() * 20, a: 0.05 + rng() * 0.07, hue: rng() });
}

// pre-rendered vignette
const vigCv = document.createElement('canvas'); vigCv.width = W; vigCv.height = H;
{
  const g = vigCv.getContext('2d');
  const grad = g.createRadialGradient(W/2, H*0.55, H*0.42, W/2, H*0.55, H*0.95);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
}
// pre-rendered glow sprites for embers (avoids per-particle shadowBlur)
const EMBER_COLORS = ['#ffb060', '#ff7a3a', '#ffd98e', '#9fd0ff'];
const emberSprites = EMBER_COLORS.map(col => {
  const c = document.createElement('canvas'); c.width = c.height = 48;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(24, 24, 0, 24, 24, 24);
  gr.addColorStop(0, rgba('#ffffff', 0.95));
  gr.addColorStop(0.25, rgba(col, 0.9));
  gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 48, 48);
  return c;
});
// pre-rendered mist sprites
const mistSprites = ['#41536f', '#4a3f5c'].map(col => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  gr.addColorStop(0, rgba(col, 1));
  gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  return c;
});
// pre-rendered grain tile
const grainCv = document.createElement('canvas'); grainCv.width = 256; grainCv.height = 256;
{
  const g = grainCv.getContext('2d');
  const img = g.createImageData(256, 256);
  const gr = mulberry32(777);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 100 + gr() * 90;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
}

// ---------- particles ----------
const DT = 1 / FPS;
const embers = [], petals = [], streaks = [];
const prng = mulberry32(4649);
function gauss() { return (prng() + prng() + prng()) * 2 / 3 - 1; }

function spawnEmber(t, sec, burst) {
  const cx = W / 2;
  embers.push({
    x: cx + gauss() * 430, y: H - 60 + gauss() * 50,
    vx: gauss() * 24, vy: -(34 + prng() * (burst ? 150 : 95)),
    wob: prng() * Math.PI * 2, wobSp: 0.8 + prng() * 2.4,
    life: 0, maxLife: 2.6 + prng() * 3.2,
    r: 1.2 + prng() * 2.6, hue: prng(), cold: sec.cold
  });
}
function spawnPetal() {
  petals.push({
    x: prng() * W, y: -22, vy: 42 + prng() * 46,
    swayA: 34 + prng() * 60, swaySp: 0.5 + prng() * 1.1, ph: prng() * Math.PI * 2,
    rot: prng() * Math.PI * 2, rotSp: (prng() - 0.5) * 2.4,
    size: 7 + prng() * 9, life: 0, hue: prng()
  });
}
function spawnStreak(sec) {
  const fromLeft = prng() < 0.5;
  const y0 = H * (0.12 + prng() * 0.4);
  streaks.push({
    x0: fromLeft ? -160 : W + 160, y0,
    x1: fromLeft ? W + 160 : -160, y1: y0 + (prng() - 0.3) * H * 0.5,
    bow: (prng() < 0.5 ? -1 : 1) * (220 + prng() * 300),
    life: 0, maxLife: 0.5 + prng() * 0.25,
    w: 2.2 + prng() * 2.6
  });
}

// ---------- lyric layout ----------
function drawLyric(t, sec) {
  if (!LYR) return;
  for (const line of LYR.lines) {
    if (t < line.s - 0.55 || t > line.e + 0.55) continue;
    const aIn = smoothstep((t - (line.s - 0.55)) / 0.55);
    const aOut = smoothstep((line.e + 0.55 - t) / 0.55);
    const alpha = Math.min(aIn, aOut);
    if (alpha <= 0) continue;

    let size = 58;
    const rubySize = 23;
    ctx.font = `700 ${size}px Shippori`;
    let total = 0;
    for (const s of line.seg) total += ctx.measureText(s.t).width;
    if (total > 1680) { size = Math.floor(size * 1680 / total); ctx.font = `700 ${size}px Shippori`;
      total = 0; for (const s of line.seg) total += ctx.measureText(s.t).width; }

    const y = H - BAR - 64 + (1 - aIn) * 10;
    let x = (W - total) / 2;
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    for (const s of line.seg) {
      ctx.font = `700 ${size}px Shippori`;
      const w = ctx.measureText(s.t).width;
      // glow pass
      ctx.shadowColor = rgba('#000000', 0.9); ctx.shadowBlur = 8;
      ctx.fillStyle = `rgba(20,12,8,${alpha * 0.85})`;
      ctx.fillText(s.t, x + 2, y + 2);
      ctx.shadowColor = sec.accent; ctx.shadowBlur = 22;
      ctx.fillStyle = `rgba(246,240,229,${alpha})`;
      ctx.fillText(s.t, x, y);
      if (s.r) {
        ctx.font = `400 ${rubySize}px Shippori`;
        const rw = ctx.measureText(s.r).width;
        ctx.shadowBlur = 10;
        ctx.fillStyle = `rgba(238,226,208,${alpha * 0.92})`;
        ctx.fillText(s.r, x + (w - rw) / 2, y - size * 0.98);
      }
      x += w;
    }
    ctx.restore();
  }
}

// ---------- title & credits ----------
function drawTitle(t) {
  if (t > 12.5) return;
  const a = smoothstep((t - 1.2) / 2.2) * smoothstep((12.0 - t) / 2.0);
  if (a <= 0) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '150px Yuji';
  ctx.shadowColor = '#ff9a4a'; ctx.shadowBlur = 42;
  ctx.fillStyle = `rgba(248,240,228,${a})`;
  ctx.fillText((LYR.titleKanji || LYR.title).split('').join(' '), W / 2, H * 0.43);
  ctx.font = '44px Yuji';
  ctx.shadowBlur = 20;
  ctx.fillStyle = `rgba(240,228,210,${a * 0.95})`;
  ctx.fillText('K a g e b i', W / 2, H * 0.43 + 88);
  ctx.font = '400 27px Shippori';
  ctx.shadowBlur = 0;
  ctx.fillStyle = `rgba(210,200,188,${a * 0.85})`;
  ctx.fillText('— E l e c t r o n i c   B a n d   M i x —', W / 2, H * 0.43 + 150);
  ctx.restore();
}
function drawCredits(t) {
  const DUR = FEAT.duration;
  if (t < DUR - 8) return;
  const a = smoothstep((t - (DUR - 7)) / 3);
  ctx.save();
  ctx.fillStyle = `rgba(0,0,0,${a * 0.88})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '64px Yuji';
  ctx.shadowColor = '#ff9a4a'; ctx.shadowBlur = 26;
  ctx.fillStyle = `rgba(240,232,220,${a})`;
  ctx.fillText((LYR.titleKanji || LYR.title).split('').join(' '), W / 2, H * 0.72);
  ctx.font = '400 24px Shippori';
  ctx.shadowBlur = 0;
  ctx.fillStyle = `rgba(190,180,170,${a * 0.9})`;
  ctx.fillText('Kagebi — Electronic Band Mix', W / 2, H * 0.72 + 58);
  ctx.restore();
}

// ---------- chōchin lantern ----------
function drawLantern(t, sec, bass) {
  const a = sec.lantern;
  if (a <= 0.01) return;
  const cx = W / 2, top = H * 0.40;
  const sway = Math.sin(t * 0.55) * 0.035;
  const bw = 78, bh = 205;
  ctx.save();
  ctx.translate(cx, top);
  ctx.rotate(sway);
  ctx.globalAlpha = a;
  // hanging cord
  ctx.strokeStyle = 'rgba(190,170,150,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -H * 0.42); ctx.lineTo(0, -14); ctx.stroke();
  // inner glow (behind paper)
  const pulse = 0.85 + bass * 0.3;
  const g0 = ctx.createRadialGradient(0, bh / 2, 8, 0, bh / 2, 200 * pulse);
  g0.addColorStop(0, 'rgba(255,190,110,0.55)');
  g0.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = g0;
  ctx.fillRect(-220, bh / 2 - 220, 440, 440);
  // paper body
  const body = ctx.createLinearGradient(0, 0, 0, bh);
  body.addColorStop(0, '#4a130a');
  body.addColorStop(0.45, `rgba(${200 + Math.round(bass * 40)},70,25,1)`);
  body.addColorStop(0.55, `rgba(${210 + Math.round(bass * 40)},85,30,1)`);
  body.addColorStop(1, '#3a0f08');
  ctx.beginPath();
  ctx.moveTo(-bw * 0.48, 6);
  ctx.bezierCurveTo(-bw * 1.06, bh * 0.25, -bw * 1.06, bh * 0.75, -bw * 0.48, bh - 6);
  ctx.lineTo(bw * 0.48, bh - 6);
  ctx.bezierCurveTo(bw * 1.06, bh * 0.75, bw * 1.06, bh * 0.25, bw * 0.48, 6);
  ctx.closePath();
  ctx.fillStyle = body; ctx.fill();
  // bright core
  const core = ctx.createRadialGradient(0, bh * 0.52, 4, 0, bh * 0.52, bw * (0.95 + bass * 0.25));
  core.addColorStop(0, `rgba(255,225,160,${0.8 + bass * 0.2})`);
  core.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.moveTo(-bw * 0.48, 6);
  ctx.bezierCurveTo(-bw * 1.06, bh * 0.25, -bw * 1.06, bh * 0.75, -bw * 0.48, bh - 6);
  ctx.lineTo(bw * 0.48, bh - 6);
  ctx.bezierCurveTo(bw * 1.06, bh * 0.75, bw * 1.06, bh * 0.25, bw * 0.48, 6);
  ctx.closePath(); ctx.fill();
  // ribs
  ctx.strokeStyle = 'rgba(30,10,5,0.4)';
  ctx.lineWidth = 1.6;
  for (let i = 1; i <= 8; i++) {
    const yy = bh * i / 9;
    const half = bw * (0.5 + 0.56 * Math.sin(Math.PI * i / 9));
    ctx.beginPath();
    ctx.ellipse(0, yy, half, 7, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // caps
  ctx.fillStyle = '#171310';
  ctx.beginPath(); ctx.roundRect(-bw * 0.55, -12, bw * 1.1, 20, 5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-bw * 0.55, bh - 8, bw * 1.1, 18, 5); ctx.fill();
  ctx.restore();
}

// ---------- main frame ----------
let lastFrame = -1;
let onsetSet = null;

function renderFrame(i, skipEncode) {
  const t = i / FPS;
  const f = FEAT;
  const N = f.rms.length;
  const idx = Math.min(i, N - 1);
  const bass = f.bass[idx], mid = f.mid[idx], high = f.high[idx], energy = f.energy[idx];
  const sec = sectionAt(t);
  if (!onsetSet) onsetSet = new Set(f.onsets);
  const isOnset = onsetSet.has(idx);

  // --- sky ---
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, sec.skyTop);
  sky.addColorStop(1, sec.skyBot);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // --- stars ---
  ctx.save();
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
    const a = s.a * tw * (0.55 + high * 0.55) * (1 - sec.glowI * 0.45);
    if (a < 0.02) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dfe8f2';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // --- moon ---
  if (sec.moon > 0.03) {
    const mx = W * 0.78 + Math.sin(t * 0.02) * 12, my = H * 0.22;
    ctx.save();
    const halo = ctx.createRadialGradient(mx, my, 30, mx, my, 190 + sec.cold * 80);
    halo.addColorStop(0, `rgba(214,226,240,${0.34 * sec.moon})`);
    halo.addColorStop(1, 'rgba(214,226,240,0)');
    ctx.fillStyle = halo; ctx.fillRect(mx - 300, my - 300, 600, 600);
    ctx.globalAlpha = 0.85 * sec.moon;
    ctx.fillStyle = '#e6ecf4';
    ctx.beginPath(); ctx.arc(mx, my, 58, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // --- faint kanji watermark ---
  ctx.save();
  ctx.font = '760px Yuji';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.038 * sec.f + 0.014;
  ctx.fillStyle = sec.accent;
  ctx.fillText(sec.kanji, W * 0.795, H * 0.82);
  ctx.restore();

  // --- glow heart (the distant fire) ---
  const gcx = W / 2, gcy = H * 0.66;
  const breathe = 1 + Math.sin(t * 1.7) * 0.03 + bass * 0.22;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const R1 = (330 + sec.glowI * 300) * breathe;
  const g1 = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, R1);
  g1.addColorStop(0, rgba('#ffdda6', 0.26 * sec.glowI + bass * 0.12));
  g1.addColorStop(0.35, lerpHex(sec.glowA, sec.glowB, sec.f).replace('rgb', 'rgba').replace(')', `,${0.24 * sec.glowI})`));
  g1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(gcx - R1, gcy - R1, R1 * 2, R1 * 2);
  const R2 = (130 + sec.glowI * 120) * breathe;
  const g2 = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, R2);
  g2.addColorStop(0, rgba('#fff1cf', 0.5 * sec.glowI));
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(gcx - R2, gcy - R2, R2 * 2, R2 * 2);
  ctx.restore();

  // --- spectrum ring (instrumental showcase) ---
  if (sec.ring > 0.02) {
    const bands = f.bands[idx];
    const NB = bands.length;
    const baseR = 210 + bass * 55;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';
    const rot = t * 0.22;
    for (let k = 0; k < NB * 2; k++) {
      const v = bands[k < NB ? k : NB * 2 - 1 - k];
      const ang = rot + Math.PI * k / NB;
      const len = 14 + v * 120;
      const x0 = gcx + Math.cos(ang) * baseR, y0 = gcy + Math.sin(ang) * baseR;
      const x1 = gcx + Math.cos(ang) * (baseR + len), y1 = gcy + Math.sin(ang) * (baseR + len);
      ctx.strokeStyle = rgba('#ffce8e', sec.ring * (0.10 + v * 0.42));
      ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    // base circle
    ctx.strokeStyle = rgba('#ffb066', sec.ring * 0.28);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(gcx, gcy, baseR - 6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // --- mist ---
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const m of mists) {
    const mx = ((m.x + m.vx * t) % (W + 2 * m.r)) - m.r;
    const a = m.a * sec.mist;
    if (a < 0.01) continue;
    ctx.globalAlpha = a;
    ctx.drawImage(mistSprites[m.hue < 0.5 ? 0 : 1], mx - m.r, m.y - m.r, m.r * 2, m.r * 2);
  }
  ctx.restore();

  // --- particles: spawn (sequential determinism) ---
  if (i !== lastFrame) {   // only advance sim on new frames
    const emberRate = (2.5 + energy * 17 + sec.glowI * 6) / FPS;
    let n = Math.floor(emberRate) + (prng() < emberRate % 1 ? 1 : 0);
    if (isOnset) n += 3 + Math.floor(energy * 9);
    for (let k = 0; k < n; k++) spawnEmber(t, sec, isOnset);
    const petalRate = sec.petals * 5.5 / FPS;
    if (prng() < petalRate) spawnPetal();
    if (isOnset && sec.streaks > 0.05 && prng() < sec.streaks * 0.75 && streaks.length < 4) spawnStreak(sec);

    for (const e of embers) {
      e.life += DT;
      e.x += (e.vx + Math.sin(t * e.wobSp + e.wob) * 26) * DT;
      e.y += e.vy * DT;
      e.vy *= 0.998;
    }
    for (const p of petals) {
      p.life += DT;
      p.y += p.vy * DT;
      p.x += Math.cos(t * p.swaySp + p.ph) * p.swayA * DT;
      p.rot += p.rotSp * DT;
    }
    for (const s of streaks) s.life += DT;
    for (let k = embers.length - 1; k >= 0; k--) if (embers[k].life > embers[k].maxLife || embers[k].y < -20) embers.splice(k, 1);
    for (let k = petals.length - 1; k >= 0; k--) if (petals[k].y > H + 30) petals.splice(k, 1);
    for (let k = streaks.length - 1; k >= 0; k--) if (streaks[k].life > streaks[k].maxLife) streaks.splice(k, 1);
    lastFrame = i;
  }

  // --- streaks (tachikaze) ---
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.lineCap = 'round';
  for (const s of streaks) {
    const p = s.life / s.maxLife;
    const a = Math.sin(Math.PI * Math.min(1, p)) * 0.8;
    const midX = (s.x0 + s.x1) / 2, midY = (s.y0 + s.y1) / 2 + s.bow;
    // draw progressive arc: head moves start→end
    const head = smoothstep(p * 1.25);
    const tail = smoothstep(Math.max(0, p * 1.25 - 0.35));
    ctx.beginPath();
    const STEPS = 26;
    let started = false;
    for (let q = 0; q <= STEPS; q++) {
      const u = q / STEPS;
      if (u < tail || u > head) continue;
      const x = (1-u)*(1-u)*s.x0 + 2*(1-u)*u*midX + u*u*s.x1;
      const y = (1-u)*(1-u)*s.y0 + 2*(1-u)*u*midY + u*u*s.y1;
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    // soft halo, then bright core — reads as a blade of light
    ctx.strokeStyle = rgba('#7ea8d8', a * 0.35);
    ctx.lineWidth = s.w * 6;
    ctx.stroke();
    ctx.strokeStyle = rgba('#bcd8f5', a * 0.6);
    ctx.lineWidth = s.w * 2.4;
    ctx.stroke();
    ctx.strokeStyle = rgba('#f2f8ff', a);
    ctx.lineWidth = s.w;
    ctx.stroke();
  }
  ctx.restore();

  // --- petals (adabana) ---
  ctx.save();
  for (const p of petals) {
    const fadeIn = Math.min(1, p.life / 0.5);
    const a = 0.75 * fadeIn;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    const col = p.hue < 0.55 ? '#f2b8c0' : '#f5cfa2';
    ctx.fillStyle = rgba(col, a);
    ctx.beginPath();
    ctx.moveTo(0, -p.size);
    ctx.bezierCurveTo(p.size * 0.9, -p.size * 0.4, p.size * 0.55, p.size * 0.7, 0, p.size);
    ctx.bezierCurveTo(-p.size * 0.55, p.size * 0.7, -p.size * 0.9, -p.size * 0.4, 0, -p.size);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // --- embers ---
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const e of embers) {
    const p = e.life / e.maxLife;
    const a = Math.sin(Math.PI * Math.min(1, p)) * 0.9;
    if (a < 0.02) continue;
    const si = e.cold > 0.5 ? 3 : (e.hue < 0.6 ? 0 : (e.hue < 0.85 ? 1 : 2));
    const s = e.r * 7;
    ctx.globalAlpha = a;
    ctx.drawImage(emberSprites[si], e.x - s / 2, e.y - s / 2, s, s);
  }
  ctx.restore();

  // --- lantern (outro) ---
  drawLantern(t, sec, bass);

  // --- vignette + grain ---
  ctx.drawImage(vigCv, 0, 0);
  ctx.save();
  ctx.globalAlpha = 0.05;
  const gx = Math.floor(prng() * 256), gy = Math.floor(prng() * 256);
  for (let yy = -gy; yy < H; yy += 256)
    for (let xx = -gx; xx < W; xx += 256)
      ctx.drawImage(grainCv, xx, yy);
  ctx.restore();

  // --- letterbox ---
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, BAR);
  ctx.fillRect(0, H - BAR, W, BAR);

  // --- text layers ---
  drawTitle(t);
  drawLyric(t, sec);
  drawCredits(t);

  return skipEncode ? null : cv.toDataURL('image/jpeg', 0.93);
}

// ---------- API for the driver ----------
window.initMV = function(features, lyrics) {
  FEAT = features; LYR = lyrics;
  return { frames: FEAT.rms.length, fps: FPS };
};
window.renderFrame = renderFrame;
window.renderBatch = function(start, count) {
  const out = [];
  for (let k = start; k < start + count; k++) out.push(renderFrame(k));
  return out;
};
window.fontsReady = document.fonts.load('700 58px Shippori')
  .then(() => document.fonts.load('400 23px Shippori'))
  .then(() => document.fonts.load('150px Yuji'))
  .then(() => true);
</script>
</body>
</html>
