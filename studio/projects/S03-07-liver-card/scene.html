<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>S03-07 liver card</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400;500&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#note{position:absolute;left:0;right:0;top:300px;text-align:center;font:400 30px/1 "Noto Sans JP";color:#6e6e73;opacity:0}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="note">架空のライバーのサンプルです</div>
<script type="module">
// 暗い部屋の机に、すりガラス（エッジライトのアクリル）の板。モニタが点くと板の縁から光が入り、彫った文字が光る
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const D=window.__DATA||{name:"宵待 ルカ",en:"YOIMACHI RUKA",lines:["配信　毎週 火・金 22:00〜","雑談 ／ 歌枠 ／ ホラーゲーム"]};
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:28,envIntensity:0,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=.7;S.bloom.strength=.45;S.bloom.radius=.5;}
scene.fog=new THREE.FogExp2(0,.12);scene.background=new THREE.Color(0);
// 机（黒い天板、少し艶）
const desk=new THREE.Mesh(new THREE.BoxGeometry(4,.04,2),new THREE.MeshPhysicalMaterial({color:0x14161a,roughness:.25,clearcoat:.8,clearcoatRoughness:.15}));
desk.position.set(0,-.02,0);desk.receiveShadow=true;scene.add(desk);
// 板（すりガラス）
const PW=.62,PH=.86,PT=.012;
const glass=new THREE.Mesh(new THREE.BoxGeometry(PW,PH,PT),new THREE.MeshPhysicalMaterial({color:0xc8d6e0,roughness:.42,transmission:.85,thickness:.012,ior:1.49,metalness:0}));
glass.position.set(0,PH/2+.035,0);glass.castShadow=true;scene.add(glass);
// 台座（板を立てる黒い溝の台）
const base=new THREE.Mesh(new THREE.BoxGeometry(PW+.04,.035,.07),new THREE.MeshStandardMaterial({color:0x111111,roughness:.5,metalness:.4}));base.position.set(0,.0175,0);base.castShadow=true;scene.add(base);
// 彫った文字（板の中に置く発光の面。エッジから入った光で光る）
let etch=null;
async function makeEtch(){
  await document.fonts.load('600 200px "Shippori Mincho"',D.name);await document.fonts.load('400 60px "Noto Sans JP"',D.lines.join(''));
  const mk=draw=>{const cv=document.createElement('canvas');cv.width=1240;cv.height=1720;const x=cv.getContext('2d');
    x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#fff';x.textAlign='center';draw(x);
    const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
    const mat=new THREE.MeshBasicMaterial({map:tex,color:0x000000,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
    const m=new THREE.Mesh(new THREE.PlaneGeometry(PW*.94,PW*.94*cv.height/cv.width),mat);m.position.set(0,PH/2+.035,PT/2+.0005);scene.add(m);return m;};
  etch=mk(x=>{x.font='600 190px "Shippori Mincho"';x.fillText(D.name,620,700);x.font='500 46px "Noto Sans JP"';x.letterSpacing='14px';x.fillText(D.en,620,800);});
  etch.userData.info=mk(x=>{x.fillRect(470,880,300,3);x.font='400 58px "Noto Sans JP"';x.letterSpacing='4px';D.lines.forEach((l,i)=>x.fillText(l,620,1040+i*100));});
}
// モニタの光（画面の左手前・青白い）と、板の縁に当たる光の筋
const mon=C.spot(scene,{pos:[-1.3,.55,1.1],target:[0,.4,0],color:0x9cc8ff,intensity:0,angle:.55,penumbra:1,shadow:true});
const monGlow=new THREE.Mesh(new THREE.PlaneGeometry(.9,.55),new THREE.MeshBasicMaterial({color:0x9cc8ff,transparent:true,opacity:0}));
monGlow.position.set(-1.6,.45,1.2);monGlow.lookAt(0,.4,0);scene.add(monGlow);
const edge=new THREE.Mesh(new THREE.BoxGeometry(.004,PH,PT*1.05),new THREE.MeshBasicMaterial({color:0xcfe6ff,transparent:true,opacity:0}));edge.position.set(-PW/2,PH/2+.035,0);scene.add(edge);
window.__ready=makeEtch();
const ON=0.0, NAME=3.0, INFO=6.0;
window.renderAt=t=>{
  // モニタはフレーム0で点く（短いちらつき）→ 3.0 で文字が光る（拍）→ 6.0 で情報の行（拍）
  const flick=t<.25?(Math.sin(t*90)>0?.4:.15):1;
  const m=ease.outCubic(prog(t,ON,.35))*flick;
  mon.intensity=5*m;monGlow.material.opacity=.0*m;edge.material.opacity=.55*m;
  const nk=t>=NAME?Math.min(1,.65+.35*prog(t,NAME,.4)):0, ik=t>=INFO?Math.min(1,.6+.4*prog(t,INFO,.4)):0;
  if(etch){const c=new THREE.Color(0xd6ebff);etch.material.color.copy(c.multiplyScalar(.15*m+.85*nk));
}
  // 情報の行は INFO まで隠す（文字の下半分を暗く）: 同じテクスチャなので名前と行を別強度にするため2枚目を使う
  if(etch&&etch.userData.info){etch.userData.info.material.color.setScalar(.9*ik);}
  // カメラ：右手前から回り込みながら寄る（モニタと逆側）＋最後にラックフォーカス
  const k=ease.inOutSine(prog(t,0,10));
  const az=lerp(.5,.16,k), d=lerp(4.0,3.3,k), y=lerp(.75,.6,k);
  camera.position.set(Math.sin(az)*d,y,Math.cos(az)*d);camera.lookAt(0,.47,0);
  if(S.bokeh){S.bokeh.uniforms.focus.value=d;S.bokeh.uniforms.aperture.value=lerp(.004,.0015,prog(t,2.5,1.2));}
  document.getElementById('note').style.opacity=(ease.outCubic(prog(t,6.3,.6))).toFixed(3);
  S.render();
};
</script></body></html>
