<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>S06-03 one day</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#ov{position:absolute;inset:0;color:#efe9df;pointer-events:none;font-family:"Noto Sans JP"}
.t{position:absolute;opacity:0}
#clock{left:120px;top:96px;font:300 56px/1 "Noto Sans JP";letter-spacing:.06em;font-variant-numeric:tabular-nums}
#ph{left:122px;top:168px;font:400 26px/1 "Noto Sans JP";color:#a69d90;letter-spacing:.2em}
#title{left:0;right:0;top:110px;text-align:center;font:600 64px/1 "Shippori Mincho";letter-spacing:.24em;text-indent:.24em}
#co{left:0;right:0;top:200px;text-align:center;font:300 28px/1 "Noto Sans JP";letter-spacing:.3em;text-indent:.3em;color:#a69d90}
#note{right:120px;bottom:60px;font:400 22px/1 "Noto Sans JP";color:#86868b}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="ov"><div class="t" id="clock"></div><div class="t" id="ph"></div><div class="t" id="title">光の一日</div><div class="t" id="co">白縫建築設計</div><div class="t" id="note">架空の事務所・建物のサンプルです</div></div>
<script type="module">
// 黒い背景の撮影台に置いた白い建築模型。朝の斜光→昼→夕→夜（窓が灯る）。カメラはゆっくり模型を回る
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:28,envIntensity:0,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=1.4;S.bloom.strength=.25;S.bloom.radius=.4;}
scene.fog=null;scene.background=new THREE.Color(0);
const white=new THREE.MeshStandardMaterial({color:0xf1eee8,roughness:.85});
const base=new THREE.Mesh(new THREE.BoxGeometry(3.2,.06,2.4),new THREE.MeshStandardMaterial({color:0xdedad2,roughness:.9}));base.position.y=-.03;base.receiveShadow=true;scene.add(base);
const add=(w,h,d,x,z,y=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),white);m.position.set(x,y+h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m;};
// 中庭を囲む L 字の棟と、細い柱の回廊、低い棟、塔
add(1.6,.42,.36,-.2,-.62);add(.36,.42,1.0,-.82,-.06);add(.9,.22,.5,.75,.55);add(.3,.9,.3,1.05,-.7);
for(let i=0;i<9;i++)add(.025,.24,.025,-.55+i*.16,.38);add(1.4,.025,.12,.09,.38,.24);
add(.5,.06,.5,.25,-.05);
// 窓（夜に灯る面）
const winMat=new THREE.MeshBasicMaterial({color:0});const wins=[];
const win=(w,h,x,y,z,ry=0)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),winMat);m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);wins.push(m);};
for(let i=0;i<7;i++){win(.12,.07,-.86+i*.21,.12,-.438);win(.12,.07,-.86+i*.21,.28,-.438);}
for(let i=0;i<4;i++)win(.12,.06,.42+i*.2,.11,.801);
for(let k=0;k<4;k++)win(.08,.1,1.05,.2+k*.18,-.549);
for(let i=0;i<4;i++)win(.12,.07,-.639,.12+(i%2)*.16,-.35+Math.floor(i/2)*.4,Math.PI/2);
// 太陽（色温度と高さが変わる平行光）と空の照り返し
const sun=new THREE.DirectionalLight(0xffffff,0);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-2.5,right:2.5,top:2.5,bottom:-2.5,near:.5,far:20});sun.shadow.bias=-.0004;sun.shadow.radius=3;scene.add(sun);scene.add(sun.target);
const sky=new THREE.HemisphereLight(0x8fa8d8,0x1a1612,0);scene.add(sky);
const interior=new THREE.PointLight(0xffb469,0,3,2);interior.position.set(-.2,.25,-.1);scene.add(interior);
// 時刻の進み方：0=5:30 → 40秒で 22:00
const HIT=30.0;
const kelvin=k=>{k/=100;let r,g,b;if(k<=66){r=255;g=99.47*Math.log(k)-161.12;b=k<=19?0:138.5*Math.log(k-10)-305.04;}else{r=329.7*Math.pow(k-60,-.133);g=288.1*Math.pow(k-60,-.0755);b=255;}return new THREE.Color(Math.min(255,Math.max(0,r))/255,Math.min(255,Math.max(0,g))/255,Math.min(255,Math.max(0,b))/255);};
const $=id=>document.getElementById(id);
window.__ready=document.fonts.ready;
window.renderAt=t=>{
  // 太陽の経路：3秒で日の出（東＝+x 側の低い位置）→ 15秒で南中 → 28秒で日没（西）
  const d=prog(t,3,25);                                  // 0..1 昼の進み
  const ang=lerp(-.05,Math.PI+.05,d);                   // 地平線から地平線まで
  const el=Math.sin(ang);                                // 高さ
  sun.position.set(Math.cos(ang)*6,Math.max(.15,el*6),-2.2+1.4*Math.sin(d*Math.PI));sun.target.position.set(0,0,0);
  const dayOn=ease.outCubic(prog(t,2.6,1.4))*(1-ease.inOutSine(prog(t,27.2,1.8)));
  const K=lerp(2300,5600,Math.pow(Math.max(0,el),.6));
  sun.color.copy(kelvin(K));sun.intensity=dayOn*lerp(3.6,2.1,Math.max(0,el));
  sky.intensity=.25*dayOn*Math.max(.15,el)+.06;sky.color.copy(kelvin(lerp(9000,7000,el)));
  // 夜：無音の後のインパクトで窓が一斉に灯る
  const night=t>=HIT?1:0;
  winMat.color.setRGB(1.6*night,1.05*night,.55*night);interior.intensity=.25*night;
  if(t>=29.25&&t<HIT){sky.intensity=.03;}
  // カメラ：模型のまわりをゆっくり 100° 回る＋わずかに降りる
  const a=lerp(.9,-.85,ease.inOutSine(prog(t,0,40))), r=lerp(4.6,3.9,prog(t,0,40)), y=lerp(2.2,1.35,ease.inOutSine(prog(t,0,40)));
  camera.position.set(Math.sin(a)*r,y,Math.cos(a)*r);camera.lookAt(0,.15,0);
  if(S.bokeh){S.bokeh.uniforms.focus.value=r;S.bokeh.uniforms.aperture.value=.0009;}
  const hh=5.5+t*(16.5/40), hm=Math.floor((hh%1)*60);
  $('clock').textContent=`${String(Math.floor(hh)).padStart(2,'0')}:${String(hm).padStart(2,'0')}`;$('clock').style.opacity=(ease.outCubic(prog(t,.5,.6))*(1-prog(t,33,.6))).toFixed(3);
  const ph=t<3?'夜明け前':t<9?'朝':t<20?'昼':t<29?'夕':'夜';$('ph').textContent=ph;$('ph').style.opacity=$('clock').style.opacity;
  $('title').style.opacity=ease.outCubic(prog(t,33.5,.8)).toFixed(3);$('co').style.opacity=ease.outCubic(prog(t,34.2,.8)).toFixed(3);$('note').style.opacity=ease.outCubic(prog(t,34.5,.6)).toFixed(3);
  S.render();
};
</script></body></html>
