<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>S04-01 tubes</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#ov{position:absolute;inset:0;color:#efe9df;pointer-events:none;font-family:"Noto Sans JP"}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0}
#band{top:300px;font:600 128px/1 "Shippori Mincho";letter-spacing:.16em;text-indent:.16em}
#sub{top:460px;font:400 40px/1 "Noto Sans JP";letter-spacing:.3em;text-indent:.3em;color:#d9cbb6}
#date{top:1300px;font:400 46px/1.5 "Noto Sans JP";letter-spacing:.12em;color:#d9cbb6}
#note{top:1440px;font:400 28px/1 "Noto Sans JP";color:#8a8278}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="ov"><div class="t" id="band">残響室</div><div class="t" id="sub">ONE-MAN LIVE「真空」</div><div class="t" id="date">12.24 THU　港町ホール</div><div class="t" id="note">架空のバンドのサンプルです</div></div>
<script type="module">
// 暗闇でギターアンプの真空管が1本ずつ灯り、その光が舞台を照らして日時と会場が立つ
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:30,envIntensity:.05,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=.7;S.bloom.strength=.55;S.bloom.radius=.45;}
scene.fog=new THREE.FogExp2(0,.06);scene.background=new THREE.Color(0);
// アンプの天板（黒い艶のある板）とシャーシ
const top=new THREE.Mesh(new THREE.BoxGeometry(1.4,.04,.5),new THREE.MeshPhysicalMaterial({color:0x0e0e0f,roughness:.3,clearcoat:.7,clearcoatRoughness:.2,metalness:.2}));top.position.set(0,-.02,0);scene.add(top);
const glass=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.05,transmission:.95,thickness:.01,ior:1.5,transparent:true,opacity:.35});
const plateM=new THREE.MeshStandardMaterial({color:0x3a3633,roughness:.4,metalness:.9});
const tubes=[];
for(let i=0;i<4;i++){
  const g=new THREE.Group();g.position.set((i-1.5)*.2,0,0);
  const sock=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.03,32),new THREE.MeshStandardMaterial({color:0x111111,roughness:.5}));sock.position.y=.015;g.add(sock);
  const env=new THREE.Mesh(new THREE.CapsuleGeometry(.04,.16,8,32),glass);env.position.y=.15;g.add(env);
  const pl=new THREE.Mesh(new THREE.BoxGeometry(.05,.09,.012),plateM);pl.position.set(0,.14,.012);g.add(pl);
  const pl2=pl.clone();pl2.position.z=-.012;g.add(pl2);
  const fil=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.1,8),new THREE.MeshBasicMaterial({color:0}));fil.position.y=.14;g.add(fil);
  const glow=new THREE.PointLight(0xff8a3a,0,1.6,2);glow.position.y=.14;g.add(glow);
  scene.add(g);tubes.push({fil,glow});
}
// 舞台の明かり（インパクトで点く暖色のトップ）
const st=C.spot(scene,{pos:[0,3.2,1.2],target:[0,0,0],color:0xffb070,intensity:0,angle:.35,penumbra:.8});
const stB=C.beam(scene,{from:[0,3.2,1.2],to:[0,0,0],radius:.7,color:0xffb070,density:.12});
const TT=[0,1.5,3.0,6.0], HIT=6.0;
const $=id=>document.getElementById(id);
window.__ready=document.fonts.ready;
window.renderAt=t=>{
  const sil=t>=5.25&&t<HIT;
  tubes.forEach((tb,i)=>{let v=t>=TT[i]?1:0;               // 1フレームで点く（拍に合わせる）
    v*= (i===0&&t<TT[0]+.05)?.6:1;
    v*=.92+.08*Math.sin(t*9.1+i*2);                         // 真空管の微かなゆらぎ
    if(sil)v*=.35;
    tb.fil.material.color.setRGB(1.8*v,.75*v,.25*v);tb.glow.intensity=(t>=HIT?.9:.6)*v;});
  const s=t>=HIT?1:0;st.intensity=60*s*(.94+.06*Math.sin(t*2));stB.set(t,s);
  // カメラ：真空管のすぐ横から寄った低い位置で横へ流れる → 6.0 で引き上がって舞台全体
  const u=ease.inOutCubic?ease.inOutCubic(prog(t,HIT,2.4)):ease.inOutSine(prog(t,HIT,2.4));
  const ax=lerp(-.3,.3,prog(t,0,HIT));const x=lerp(ax+.12,0,u), y=lerp(.2,.62,u), z=lerp(.85,3.3,u)-.15*prog(t,9,6);
  camera.position.set(x,y,z);camera.lookAt(lerp(ax,0,u),lerp(.14,.2,u),0);
  if(S.bokeh){S.bokeh.uniforms.focus.value=Math.hypot(x-ax*(1-u),y-.14,z);S.bokeh.uniforms.aperture.value=lerp(.0025,.001,u);}
  $('band').style.opacity=ease.outCubic(prog(t,HIT+.2,.5)).toFixed(3);$('sub').style.opacity=ease.outCubic(prog(t,HIT+.6,.5)).toFixed(3);
  $('date').style.opacity=t>=12?1:0;$('note').style.opacity=ease.outCubic(prog(t,10,.5)).toFixed(3);
  S.render();
};
</script></body></html>
