<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>S04-02 tour rig</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400;500&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#ov{position:absolute;inset:0;color:#efe9df;pointer-events:none;font-family:"Noto Sans JP"}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0}
#band{top:250px;font:600 120px/1 "Shippori Mincho";letter-spacing:.16em;text-indent:.16em}
#tour{top:400px;font:400 38px/1 "Noto Sans JP";letter-spacing:.36em;text-indent:.36em;color:#bdb5a8}
#city{top:1180px;font:600 150px/1 "Shippori Mincho";letter-spacing:.1em;text-indent:.1em}
#date{top:1360px;font:400 44px/1 "Noto Sans JP";letter-spacing:.14em;color:#bdb5a8}
#cnt{top:1440px;font:400 28px/1 "Noto Sans JP";letter-spacing:.3em;color:#6e6e73}
#note{top:1450px;font:400 26px/1 "Noto Sans JP";color:#6e6e73}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="ov"><div class="t" id="band">残響室</div><div class="t" id="tour">TOUR 2027「灯台」</div><div class="t" id="city"></div><div class="t" id="date"></div><div class="t" id="cnt"></div><div class="t" id="note">架空のバンドのサンプルです</div></div>
<script type="module">
// 天井の照明リグを床から見上げる。都市ごとに1列ずつ灯体が点き、最終公演地で全灯
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const CITIES=[["札幌","1.16 SAT"],["仙台","1.23 SAT"],["名古屋","1.30 SAT"],["大阪","2.06 SAT"],["福岡","2.13 SAT"],["東京","2.20 SAT  TOUR FINAL"]];
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:40,envIntensity:.05,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=.8;S.bloom.strength=.45;S.bloom.radius=.35;}
scene.fog=new THREE.FogExp2(0,.035);scene.background=new THREE.Color(0);
const metal=new THREE.MeshStandardMaterial({color:0x2a2a2c,roughness:.45,metalness:.8});
const ROWS=6,COLS=5,ZS=i=>-1.0-i*1.25,Y=6.2;
// トラス（横の2本パイプ×列）
for(let r=0;r<ROWS;r++){for(const dy of [0,.35]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,5.2,12),metal);p.rotation.z=Math.PI/2;p.position.set(0,Y+.25+dy,ZS(r));scene.add(p);}}
const lenses=[],beams=[],lights=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const x=(c-(COLS-1)/2)*1.0,z=ZS(r);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.32,24),metal);body.position.set(x,Y,z);scene.add(body);
  const lens=new THREE.Mesh(new THREE.CircleGeometry(.1,24),new THREE.MeshBasicMaterial({color:0x000000}));lens.rotation.x=Math.PI/2;lens.position.set(x,Y-.165,z);scene.add(lens);lenses.push(lens);
  const tx=x*.55, tz=z+1.6;
  beams.push(C.beam(scene,{from:[x,Y-.17,z],to:[tx,0,tz],radius:.32,color:0xffe6c8,density:.1}));
  if(c%2===0){const l=C.spot(scene,{pos:[x,Y-.2,z],target:[tx,0,tz],color:0xffe6c8,intensity:0,angle:.12,penumbra:.6,shadow:false});lights.push([r,l]);}
}
C.stageFloor(scene,{material:new THREE.MeshPhysicalMaterial({color:0x0c0c0d,roughness:.4,clearcoat:.4})});
const T=[3,6,9,12,15,18], FIN=21.0;
const $=id=>document.getElementById(id);
window.__ready=document.fonts.ready;
window.renderAt=t=>{
  let n=0;T.forEach((tt,i)=>{if(t>=tt)n=i+1;});
  const sil=(t>=11.625&&t<12)||(t>=20.625&&t<21);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=r*COLS+c;
    let v=0;if(t<FIN){if(r<n)v=r===n-1?1:.35;else v=.06*ease.outCubic(prog(t,0,.8));}else v=1;
    if(sil)v*=.15;
    if(t>=FIN)v*=.85+.15*Math.sin(t*3+k*.6);
    lenses[k].material.color.setRGB(v,v*.92,v*.8);beams[k].set(t,v*(t>=FIN?.9:1));}
  lights.forEach(([r,l])=>{l.intensity=(t>=FIN||r<n)?(t>=FIN||r===n-1?120:40)*(sil?.15:1):0;});
  // カメラ：床から見上げ、都市ごとに少しずつ奥の列へ。最終で引いて全体
  const cur=Math.max(0,Math.min(ROWS-1,n-1)), f=t<FIN?ease.outCubic(prog(t,T[cur]||0,.6)):1;
  const zLook=t<FIN?lerp(ZS(Math.max(0,cur-1)),ZS(cur),n?f:0):lerp(ZS(5),ZS(2.5),ease.inOutSine(prog(t,FIN,2)));
  const camZ=(t<FIN?lerp(3.2,2.2,prog(t,0,FIN)):lerp(2.2,4.2,ease.inOutSine(prog(t,FIN,2.5))))+.05*Math.sin(t*1.3);
  camera.position.set(.55*Math.sin(t*.45),1.0+.12*Math.sin(t*.7),camZ);camera.lookAt(0,Y-.4,zLook);
  if(S.bokeh){S.bokeh.uniforms.focus.value=Math.hypot(Y-1,camZ-zLook);S.bokeh.uniforms.aperture.value=.0008;}
  const showIntro=ease.outCubic(prog(t,.2,.6))*(1-prog(t,2.7,.25));
  const fin=t>=FIN;$('band').style.top=fin?'1150px':'250px';$('tour').style.top=fin?'1300px':'400px';
  $('band').style.opacity=!fin?showIntro:ease.outCubic(prog(t,FIN+.1,.4));$('tour').style.opacity=!fin?showIntro:ease.outCubic(prog(t,FIN+.4,.4));
  if(t>=3&&t<FIN){const c=CITIES[n-1];$('city').textContent=c[0];$('date').textContent=c[1];$('cnt').textContent=`${n} / 6`;
    const a=ease.outCubic(prog(t,T[n-1],.2))*(1-prog(t,T[n-1]+2.75,.2));$('city').style.opacity=a;$('date').style.opacity=a;$('cnt').style.opacity=a;}
  else if(t>=FIN){$('city').style.opacity=0;$('date').textContent='全6都市　1.16 — 2.20　チケット 12.1 発売';$('cnt').textContent='';
    $('date').style.top='1380px';$('date').style.opacity=ease.outCubic(prog(t,FIN+.8,.4));}
  else{$('city').style.opacity=0;$('date').style.opacity=0;$('cnt').style.opacity=0;}
  $('note').style.opacity=t>=FIN?ease.outCubic(prog(t,28.7,.4)):0;
  S.render();
};
</script></body></html>
