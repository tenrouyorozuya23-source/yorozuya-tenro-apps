<body>
<a class="skip" href="#listen">本文へ移動</a>
<div class="stage" aria-hidden="true"><canvas id="stage"></canvas></div>

<header class="hero" id="top" data-shot="0">
  <p class="kana" id="kana"></p>
  <h1 id="name"></h1>
  <p class="tag" id="tagline"></p>
  <button class="light" id="light-on" type="button"><span class="dot" aria-hidden="true"></span><span id="light-lbl">灯りをつける</span></button>
  <p class="fic">※架空のシンガーソングライターの見本サイトです。灯りをつけると、1曲目の見本音源が流れます</p>
  <nav class="jump" aria-label="ページ内の移動">
    <a href="#listen">試聴</a><a href="#disc">作品</a><a href="#live">ライブ</a><a href="#about">プロフィール</a>
  </nav>
</header>

<main>
<section id="listen" class="sec" data-shot="1" aria-labelledby="h-listen">
  <h2 id="h-listen">試聴</h2>
  <p class="lead">再生すると、舞台の灯りが音に合わせて呼吸します。</p>
  <div class="player">
    <ol class="tracks" id="tracks"></ol>
    <div class="bar" id="bar">
      <p class="now" id="now">曲を選んでください</p>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置" disabled>
      <p class="time"><span id="cur">—:—</span> / <span id="dur">—:—</span></p>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </div>
  <p class="note">見本の音源です（歌なし・天狼スタジオが作曲）。</p>
</section>

<section id="disc" class="sec" data-shot="2" aria-labelledby="h-disc">
  <h2 id="h-disc">作品</h2>
  <ul class="rel" id="releases"></ul>
</section>

<section id="live" class="sec" data-shot="3" aria-labelledby="h-live">
  <h2 id="h-live">ライブ</h2>
  <ol class="lives" id="lives"></ol>
  <p class="note">※架空の公演です。チケットの販売・予約はありません。</p>
</section>

<section id="about" class="sec" data-shot="4" aria-labelledby="h-about">
  <h2 id="h-about">プロフィール</h2>
  <div class="prof" id="profile"></div>
</section>
</main>

<footer class="foot" data-shot="5">
  <p class="end" data-m>おやすみなさい</p>
  <button class="light" id="light-again" type="button"><span class="dot" aria-hidden="true"></span><span>もう一度、灯りをつける</span></button>
  <p id="discl"></p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
