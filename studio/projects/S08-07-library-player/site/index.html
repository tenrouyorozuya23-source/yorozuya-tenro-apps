<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGM ライブラリ｜天狼スタジオ</title><link rel="icon" href="data:,">
<meta name="description" content="天狼スタジオの自作 BGM ライブラリ。ムード・BPM・尺で絞り込み、6／15／30／60秒のカットを試聴できます。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--panel:#111114;--ink:#ece7df;--sub:#a8a095;--line:#2b2927;--acc:#ebbd84;--focus:#a9c2e6}
*{box-sizing:border-box;margin:0;padding:0}
html{line-break:strict;word-break:auto-phrase;background:var(--bg);color:var(--ink);font:400 15px/1.8 "Noto Sans JP",system-ui,sans-serif}
.mincho{font-family:"Shippori Mincho",serif;font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
header{padding:clamp(40px,8vw,88px) 0 28px;border-bottom:1px solid var(--line);background:radial-gradient(60% 120% at 50% 0,#ebbd8414,#0000 70%)}
.kicker{font-size:12px;letter-spacing:.34em;color:var(--sub)}
h1{font-size:clamp(30px,5vw,48px);letter-spacing:.1em;margin:.3em 0 .4em}
.lead{color:var(--sub);max-width:620px}
.filters{position:sticky;top:0;z-index:5;background:#09090bf2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row .lab{font-size:12px;letter-spacing:.2em;color:var(--sub);min-width:4.5em}
.chip{font:500 13px/1 "Noto Sans JP",sans-serif;letter-spacing:.08em;color:var(--sub);background:transparent;border:1px solid #6e665c;border-radius:999px;padding:0 16px;min-height:44px;min-width:44px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#140f08}
.chip:focus-visible,.play:focus-visible,.cut:focus-visible,canvas:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
#count{font-size:13px;color:var(--sub);margin:18px 0 6px}
ol{list-style:none}
.t{display:grid;grid-template-columns:48px 1fr;gap:6px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
.play{width:48px;height:48px;border-radius:50%;border:1px solid #7a7166;background:transparent;color:var(--ink);font-size:14px;cursor:pointer;grid-row:span 3}
.t[data-on] .play{background:var(--acc);border-color:var(--acc);color:#140f08}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.name{font-family:"Shippori Mincho",serif;font-weight:600;font-size:20px;letter-spacing:.06em}
.meta{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tag{font-size:12px;color:#d6ccbf;border:1px solid var(--line);border-radius:4px;padding:1px 8px}
canvas.wave{width:100%;height:56px;display:block;cursor:pointer;border-radius:4px}
.cuts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cut{font:500 12px/1 "Noto Sans JP",sans-serif;color:var(--sub);background:transparent;border:1px solid #6e665c;border-radius:6px;min-width:56px;min-height:44px;cursor:pointer;font-variant-numeric:tabular-nums}
.cut[aria-pressed=true]{color:var(--ink);border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.cut:disabled{opacity:.35;cursor:not-allowed}
.empty{padding:48px 0;color:var(--sub)}
.t.alt .name{color:#bdb4a8}.t.shared{box-shadow:inset 3px 0 0 var(--acc);padding-left:12px}
@media (max-width:640px){.filters{position:static}.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.row .lab{width:auto;min-width:4em;flex:none}.chip{flex:none}}
footer{margin-top:64px;border-top:1px solid var(--line);padding:28px 0;font-size:12px;color:#a59b8f}

</style></head><body>
<header><div class="wrap"><div class="kicker">TENROU STUDIO — BGM LIBRARY</div><h1 class="mincho">BGM ライブラリ</h1>
<p class="lead">天狼スタジオが自作した BGM。ムード・BPM・尺で絞り込み、映像の尺に合わせたカットをそのまま試聴できる。波形を押すとその位置から再生し、再生中の曲は URL で共有できる</p></div></header>
<div class="filters"><div class="wrap">
 <div class="row" role="group" aria-label="ムード"><span class="lab">ムード</span></div>
 <div class="row" role="group" aria-label="テンポ"><span class="lab">テンポ</span></div>
 <div class="row" role="group" aria-label="尺"><span class="lab">尺</span></div>
</div></div>
<main class="wrap"><p id="count" role="status" aria-live="polite"></p><ol id="list"></ol></main>
<footer><div class="wrap">© 天狼スタジオ（合同会社萬屋天狼）　音源はすべて当スタジオの自作（合成）。ラウドネスは -14 LUFS にそろえている</div></footer>
<script src="data.js"></script>
<script>
const MOODS=['すべて','明るい','静か','緊張','和'],TEMPO=[['すべて',0,999],['〜80',0,80],['81〜120',81,120],['121〜',121,999]],LENS=['6','15','30','60'];
const st={mood:'すべて',tempo:0,len:'30'};const audio=new Audio();audio.crossOrigin='anonymous';audio.preload='none';let cur=null;
const $=s=>document.querySelector(s);const rows=document.querySelectorAll('.filters .row');
function chips(row,items,get,set){items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=Array.isArray(it)?it[0]:(it+(row===rows[2]?'秒':''));b.onclick=()=>{set(it,i);render();};row.appendChild(b);});}
chips(rows[0],MOODS,null,(m)=>st.mood=m);chips(rows[1],TEMPO,null,(t,i)=>st.tempo=i);chips(rows[2],LENS,null,(l)=>st.len=l);
function syncChips(){rows[0].querySelectorAll('.chip').forEach((b,i)=>b.setAttribute('aria-pressed',MOODS[i]===st.mood));rows[1].querySelectorAll('.chip').forEach((b,i)=>b.setAttribute('aria-pressed',i===st.tempo));rows[2].querySelectorAll('.chip').forEach((b,i)=>b.setAttribute('aria-pressed',LENS[i]===st.len));}
function draw(cv,peaks,prog){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;const g=cv.getContext('2d');g.scale(r,r);const n=peaks.length,bw=w/n;
 peaks.forEach((p,i)=>{const x=i*bw,ph=Math.max(2,p*(h-6));g.fillStyle=i/n<prog?'#ebbd84':'#7a7166';g.fillRect(x+bw*.18,(h-ph)/2,bw*.64,ph);});}
const PLAY='▶\uFE0E',PAUSE='❚❚';
function stop(){if(cur){cur.el.removeAttribute('data-on');const b=cur.el.querySelector('.play');b.textContent=PLAY;b.setAttribute('aria-label',cur.t.title+'を再生');}}
function setVal(el,c,t){const cv=el.querySelector('.wave'),p=Math.round(Math.min(100,Math.max(0,100*t/c.sec)));cv.setAttribute('aria-valuenow',p);cv.setAttribute('aria-valuetext',`${Math.round(c.sec)}秒中 ${Math.round(t)}秒`);}
function play(t,el,cut,at){const c=t.cuts[cut];if(!c)return;if(cur&&cur.el===el&&cur.cut===cut&&!audio.paused&&at==null){audio.pause();return;}
 if(cur&&(cur.el!==el||cur.cut!==cut)){draw(cur.el.querySelector('.wave'),cur.c.peaks,0);setVal(cur.el,cur.c,0);}stop();if(!cur||cur.el!==el||cur.cut!==cut){audio.src=c.src;}cur={t,el,cut,c};if(at!=null)audio.currentTime=at*c.sec;audio.play();
 el.setAttribute('data-on','');const b=el.querySelector('.play');b.textContent=PAUSE;b.setAttribute('aria-label',t.title+'を一時停止');history.replaceState(null,'',`#${t.id}-${cut}`);}
audio.addEventListener('pause',stop);audio.addEventListener('timeupdate',()=>{if(cur){draw(cur.el.querySelector('.wave'),cur.c.peaks,audio.currentTime/cur.c.sec);setVal(cur.el,cur.c,audio.currentTime);}});
audio.addEventListener('play',()=>{if(cur){cur.el.setAttribute('data-on','');const b=cur.el.querySelector('.play');b.textContent=PAUSE;b.setAttribute('aria-label',cur.t.title+'を一時停止');}});
function render(){syncChips();audio.pause();cur=null;const [_,lo,hi]=TEMPO[st.tempo];
 const L=TRACKS.filter(t=>(st.mood==='すべて'||t.tags.includes(st.mood))&&t.bpm>=lo&&t.bpm<=hi).sort((a,b)=>(!a.cuts[st.len])-(!b.cuts[st.len]));
 const list=$('#list');list.innerHTML='';const has=L.filter(t=>t.cuts[st.len]).length;
 $('#count').textContent=`${L.length}曲（${st.len}秒のカットがあるのは${has}曲）`;
 if(!L.length){list.innerHTML='<li class="empty">条件に合う曲がありません。ムードかテンポを「すべて」に戻してください</li>';return;}
 L.forEach(t=>{const li=document.createElement('li');li.className='t';li.dataset.id=t.id;const near=LENS.filter(l=>t.cuts[l]&&+l<=+st.len).pop()||Object.keys(t.cuts)[0];const cut=t.cuts[st.len]?st.len:near;li.dataset.cut=cut;if(!t.cuts[st.len])li.classList.add('alt');
  li.innerHTML=`<button type="button" class="play" aria-label="${t.title}を再生">${PLAY}</button><div class="head"><span class="name">${t.title}</span>${t.cuts[st.len]?'':`<span class="meta">${st.len}秒なし・${cut}秒で試聴</span>`}<span class="meta">${t.id}・${t.bpm} BPM・${t.key}</span>${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
  <canvas class="wave" tabindex="0" role="slider" aria-label="${t.title}の波形。左右の矢印で5秒ずつ移動" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
  <div class="cuts" role="group" aria-label="${t.title}のカット">${LENS.map(l=>`<button type="button" class="cut" data-l="${l}" aria-pressed="${l===cut}" ${t.cuts[l]?'':'disabled'}>${l}秒</button>`).join('')}</div>`;
  list.appendChild(li);const cv=li.querySelector('.wave');draw(cv,t.cuts[cut].peaks,0);
  li.querySelector('.play').onclick=()=>play(t,li,li.dataset.cut);
  cv.onclick=e=>{const r=cv.getBoundingClientRect();play(t,li,li.dataset.cut,(e.clientX-r.left)/r.width);};
  cv.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const c=t.cuts[li.dataset.cut];const now=cur&&cur.el===li?audio.currentTime:0;const sec={ArrowRight:now+5,ArrowLeft:now-5,Home:0,End:c.sec-1}[e.key];play(t,li,li.dataset.cut,Math.min(.99,Math.max(0,sec/c.sec)));};
  li.querySelectorAll('.cut').forEach(b=>b.onclick=()=>{li.dataset.cut=b.dataset.l;li.querySelectorAll('.cut').forEach(x=>x.setAttribute('aria-pressed',x===b));draw(cv,t.cuts[b.dataset.l].peaks,0);play(t,li,b.dataset.l,0);});});}
render();(()=>{const m=location.hash.match(/^#(TNR-B\d+)-(\d+)$/);if(!m)return;const li=document.querySelector(`.t[data-id="${m[1]}"]`);if(li){li.scrollIntoView({block:'center'});li.classList.add('shared');const b=li.querySelector(`.cut[data-l="${m[2]}"]`);if(b&&!b.disabled){li.dataset.cut=m[2];li.querySelectorAll('.cut').forEach(x=>x.setAttribute('aria-pressed',x===b));draw(li.querySelector('.wave'),TRACKS.find(x=>x.id===m[1]).cuts[m[2]].peaks,0);}}})();addEventListener('resize',()=>document.querySelectorAll('.t').forEach(li=>{const t=TRACKS.find(x=>x.id===li.dataset.id);draw(li.querySelector('.wave'),t.cuts[li.dataset.cut].peaks,cur&&cur.el===li?audio.currentTime/cur.c.sec:0);}));
</script></body></html>
