<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>P017 舞台公演ティザー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Noto+Sans+JP:wght@300;400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{display:block;position:absolute;inset:0;z-index:0}
#ov{position:absolute;inset:0;z-index:5;pointer-events:none;color:#F2EEE8}
.cap{position:absolute;left:0;right:0;text-align:center;font:300 72px/1.3 "Noto Sans JP";letter-spacing:.02em;opacity:0}
#c1,#c2{top:430px}
#title{top:330px;font:500 250px/1 "Shippori Mincho";letter-spacing:.04em;text-indent:.04em}
#sub{top:612px;font:300 42px/1.4 "Noto Sans JP";letter-spacing:.12em;text-indent:.12em;color:#D9D3CA}
#note{top:690px;font:400 40px/1.5 "Noto Sans JP";letter-spacing:.06em;color:#B8B2AA}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="ov">
  <div class="cap" id="c1">誰もいない劇場に</div>
  <div class="cap" id="c2">灯りがひとつ</div>
  <div class="cap" id="title">残響</div>
  <div class="cap" id="sub">ZANKYO — 二〇二七年 冬 上演</div>
  <div class="cap" id="note">架空の公演です<br><span style="font-size:48px;letter-spacing:.16em">天狼スタジオ</span> 制作サンプル</div>
</div>
<script type="module">
import * as C from '/tools/cine/cine.js';
const {clamp,lerp,prog,ease}=C;
const S=C.createStage({exposure:1.0,fov:38,envIntensity:0});if(S.bloom){S.bloom.radius=.25;S.bloom.threshold=.92;S.bloom.strength=.26;}
const {THREE,scene,camera}=S;
scene.fog=new THREE.FogExp2(0x000000,0.045);
scene.background=new THREE.Color(0x000000);
C.stageFloor(scene,{size:40,material:new THREE.MeshPhysicalMaterial({color:0x121214,roughness:.42,clearcoat:.5,clearcoatRoughness:.25,envMapIntensity:.2})});

// ───────── 緞帳（ひだのある赤いベルベット）
const CW=12,CH=8.5;
const cg=new THREE.PlaneGeometry(CW,CH,480,24);
{const p=cg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);
  const pleat=.11*Math.sin(x*Math.PI/.32)+.04*Math.sin(x*Math.PI/.11+1.3)+.03*Math.sin(x*1.7);
  const bottom=clamp((-y+CH/2)/1.2); // 裾ほどひだが深い
  p.setZ(i,pleat*(0.75+0.45*bottom));}
 cg.computeVertexNormals();}
cg.translate(0,CH/2,0);
const velvet=new THREE.MeshPhysicalMaterial({color:0x3e0a10,roughness:.85,sheen:.4,sheenColor:new THREE.Color(0xc0606a),sheenRoughness:.45,envMapIntensity:0});
const curtain=new THREE.Mesh(cg,velvet);curtain.position.set(0,0,0);curtain.receiveShadow=true;curtain.castShadow=false;scene.add(curtain);
// 裾の房（重さを感じさせる厚い縁）
const hem=new THREE.Mesh(new THREE.BoxGeometry(CW,.12,.26),new THREE.MeshPhysicalMaterial({color:0x3a050c,roughness:.7,sheen:1,sheenColor:new THREE.Color(0xff6a50)}));
hem.position.set(0,.06,.02);curtain.add(hem);
// プロセニアム（額縁）：黒い袖幕
const blackCloth=new THREE.MeshStandardMaterial({color:0x050506,roughness:1});
for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(3,9,.3),blackCloth);w.position.set(s*(CW/2-0.4+1.5),4.5,.45);scene.add(w);}

// ───────── ホリゾント（奥の幕。床から上へ青が差す）
const cycMat=new THREE.ShaderMaterial({uniforms:{k:{value:0},col:{value:new THREE.Color(0x1d3cff)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float k;uniform vec3 col;varying vec2 vUv;void main(){float g=pow(1.-vUv.y,2.4);float sx=1.-pow(abs(vUv.x-.5)*2.,3.)*.6;float g2=pow(1.-vUv.y,5.);vec3 c=col*g2*sx*k*.42+vec3(.45,.6,1.)*pow(1.-vUv.y,14.)*k*.22;gl_FragColor=vec4(c,1.);}`});
const cyc=new THREE.Mesh(new THREE.PlaneGeometry(16,9),cycMat);cyc.position.set(0,4.5,-7);scene.add(cyc);
const cycFill=new THREE.RectAreaLight?null:null;
const cycBounce=new THREE.SpotLight(0x2a4cff,0,0,.9,1,2);cycBounce.position.set(0,.4,-6.6);cycBounce.target.position.set(0,0,2);scene.add(cycBounce,cycBounce.target);

const hemLight=new THREE.SpotLight(0x2a3cb0,0,0,.55,1,2);hemLight.position.set(2.4,.15,3.0);hemLight.target.position.set(0,1.2,0);scene.add(hemLight,hemLight.target);
const spill=new THREE.Mesh(new THREE.PlaneGeometry(16,6),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{k:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float k;varying vec2 vUv;void main(){float g=pow(vUv.y,3.);float sx=1.-pow(abs(vUv.x-.5)*2.,2.);gl_FragColor=vec4(vec3(.1,.18,.75)*g*sx*k*.35,1.);}`}));
spill.rotation.x=-Math.PI/2;spill.position.set(0,.003,-4);scene.add(spill);
// ───────── ゴーストライト（三脚・ポール・ケージ・裸電球）
const GL=new THREE.Group();GL.position.set(0,0,1.35);scene.add(GL);
const blk=new THREE.MeshPhysicalMaterial({color:0x111113,roughness:.45,metalness:.85});
const zinc=C.chrome(.3);const cageMat=new THREE.MeshPhysicalMaterial({color:0x1a1714,metalness:.6,roughness:.65});
const add=(par,geo,mat,pos,rot)=>{const m=new THREE.Mesh(geo,mat);m.position.set(...pos);if(rot)m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;par.add(m);return m};
for(let i=0;i<3;i++){const a=i*2.094+.4;const leg=new THREE.Group();leg.rotation.y=a;GL.add(leg);
  add(leg,new THREE.CylinderGeometry(.012,.012,.68,16),blk,[.25,.25,0],[0,0,.827]);
  add(leg,new THREE.SphereGeometry(.022,20,14),blk,[.5,.022,0]);}
add(GL,new THREE.CylinderGeometry(.03,.03,.12,24),blk,[0,.49,0]);
add(GL,new THREE.CylinderGeometry(.014,.014,1.25,24),zinc,[0,1.1,0]);
add(GL,new THREE.CylinderGeometry(.032,.026,.09,32),blk,[0,1.76,0]); // ソケット
const bulbY=1.88;
const glassMat=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.05,transmission:0,transparent:true,opacity:.22,emissive:new THREE.Color(0xffb46b),emissiveIntensity:0});
const bulb=add(GL,new THREE.SphereGeometry(.062,64,48),glassMat,[0,bulbY,0]);bulb.castShadow=false;
const filMat=new THREE.MeshBasicMaterial({color:0xffd9a0});
const fil=add(GL,new THREE.TorusGeometry(.02,.0032,8,48,Math.PI*1.4),filMat,[0,bulbY,0],[Math.PI/2,0,0]);fil.castShadow=false;
// ケージ：縦の針金8本＋輪3本
const cage=new THREE.Group();cage.position.y=bulbY;GL.add(cage);
for(let i=0;i<6;i++){const a=i*Math.PI/3;const w=new THREE.Mesh(new THREE.TorusGeometry(.105,.0025,6,40,Math.PI),cageMat);w.rotation.set(0,a,Math.PI/2);w.castShadow=true;cage.add(w);}
for(const y of[-.045,.045]){const r=Math.sqrt(.105*.105-y*y);const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.0025,6,48),cageMat);ring.rotation.x=Math.PI/2;ring.position.y=y;ring.castShadow=true;cage.add(ring);}
const lamp=new THREE.PointLight(0xffc27a,0,0,2);lamp.position.set(0,bulbY,0);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);lamp.shadow.radius=4;lamp.shadow.bias=-.002;GL.add(lamp);
const halo=new THREE.Mesh(new THREE.SphereGeometry(.2,32,24),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{k:{value:0}},
  vertexShader:`varying vec3 vN;varying vec3 vV;void main(){vec4 w=modelViewMatrix*vec4(position,1.);vV=normalize(-w.xyz);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*w;}`,
  fragmentShader:`uniform float k;varying vec3 vN;varying vec3 vV;void main(){float f=pow(max(dot(vN,vV),0.),5.);gl_FragColor=vec4(vec3(1.,.72,.42)*f*k*.5,1.);}`}));
halo.position.y=bulbY;GL.add(halo);
const glDust=C.dust(scene,{center:[0,1.9,1.35],radius:.8,height:1.4,count:40,seed:3,size:.005,color:0xffe0b0});

// ───────── トップスポット（中央・やや奥）＋光の筋
const SP=[0,0,1.35];
const top=C.spot(scene,{pos:[0,7.8,.9],target:SP,color:0xffd2a0,intensity:0,angle:.15,penumbra:.45});
const B=C.beam(scene,{from:[0,7.8,.9],to:SP,radius:1.12,color:0xffd2a0,density:.4});
const spDust=C.dust(scene,{center:[0,3.6,1.2],radius:.75,height:7,count:110,seed:17,size:.008});

// ───────── カメラ
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const camKeys=[ // t, pos, look, focusDist(look 対象)
  [0.0,  V(.85,1.66,3.3), V(0,1.78,1.35)],
  [2.322,V(.8,1.66,3.15),  V(0,1.78,1.35)],
  [6.6,  V(.3,1.5,7.4),    V(0,2.2,0)],
  [9.172,V(.25,1.48,8.7),  V(0,2.3,0)],
  [13.7, V(.13,1.45,8.42), V(0,2.34,.55)],
  [15.0, V(.04,1.72,4.7),  V(0,2.12,1.2)],
];
function camAt(t){
  let i=0;while(i<camKeys.length-2&&t>camKeys[i+1][0])i++;
  const [t0,p0,l0]=camKeys[i],[t1,p1,l1]=camKeys[i+1];
  let u=clamp((t-t0)/(t1-t0));
  u=i===1?ease.inOutCubic(u):i===2?ease.outCubic(u):i===3?ease.inOutSine(u):i===4?ease.outCubic(u):u; // 引きは長いイーズ、終盤は等速に近いゆっくりしたプッシュ
  return [p0.clone().lerp(p1,u),l0.clone().lerp(l1,u)];
}

const T={blackout:6.873,flick:6.316,curtain:7.454,hero:9.172,title:9.729,sub:11.447,end:13.7};
const $=id=>document.getElementById(id);
function capFade(el,t,tin,tout,rise=18){
  const a=ease.outCubic(prog(t,tin-0.033,.5))*(1-ease.inOutSine(prog(t,tout-.35,.35)));
  el.style.opacity=a.toFixed(3);el.style.transform=`translateY(${((1-ease.outQuint(prog(t,tin-0.033,.9)))*rise).toFixed(2)}px)`;
}
window.__ready=(async()=>{await Promise.all([document.fonts.load('500 250px "Shippori Mincho"','残響'),document.fonts.load('300 64px "Noto Sans JP"','誰もいない劇場に灯りがひとつ二〇冬上演'),document.fonts.load('400 30px "Noto Sans JP"','架空の公演です天狼スタジオ制作サンプル')]);await document.fonts.ready;})();

window.renderAt=t=>{
  const fi=Math.round(t*30);
  // ゴーストライト：点いている。消灯直前に1度ゆらぎ、拍で消える（フィラメントが冷える）
  let g=1;
  if(t>=T.flick&&t<T.blackout){const k=(t-T.flick)/(T.blackout-T.flick);g=1-.35*Math.pow(Math.sin(k*Math.PI),2)*(fi%3===0?1:.6);}
  if(t>=T.blackout-1/30){g=Math.pow(1-prog(t,T.blackout-1/30,.28),3);}
  const breath=1+.015*Math.sin(t*2.1);
  const wideBoost=1+1.6*ease.inOutSine(prog(t,2.322,3.5));lamp.intensity=4.4*g*breath*wideBoost; glassMat.emissiveIntensity=.45*g; halo.material.uniforms.k.value=.22*g;
  filMat.color.setRGB(1*Math.min(1,g*1.2+.0),.85*g+.0,.6*g*g); fil.visible=g>.004; bulb.visible=true;
  glassMat.opacity=.12+.23*g;
  glDust.update(t,.32*g);
  // 緞帳：暗転中に上がる。裾は遅れて揺れる（フォロースルー）
  const cuP=prog(t,T.curtain,1.7), cu=ease.inOutSine(cuP);
  curtain.position.y=cu*8.8;
  const sw=t<T.curtain+.25?0:Math.exp(-(t-T.curtain-.25)*2.2)*Math.sin((t-T.curtain-.25)*7.5);
  curtain.rotation.x=.02*sw*Math.min(1,cuP*3);
  hemLight.intensity=150*ease.outCubic(prog(t,T.curtain-.05,.4))*(1-prog(t,T.curtain+1.6,.6));
  // ホリゾント：裾の隙間から青が差す（ヒーローで下げてスポットを立たせる）
  const cy=ease.outCubic(prog(t,T.curtain-.12,1.5))*(1-.7*ease.inOutSine(prog(t,T.hero,.8)));
  cycMat.uniforms.k.value=cy; cycBounce.intensity=0; spill.material.uniforms.k.value=cy;
  // トップスポット：拍で入る（1f 早く立ち上がり、拍で8割）
  const sp=t<T.hero-1/30?0:1-Math.exp(-(t-(T.hero-1/30))*48);
  top.intensity=3400*sp; B.set(t,sp); spDust.update(t,.26*sp);
  // 結末：消えた電球のフィラメントだけが残像のように灯る（冒頭と韻）
  if(t>=T.end){
    const u=t-T.end, fl=u<.12?u/.12*.6:u<.2?.15:u<.32?.7:u<.4?.25:ease.outCubic(clamp((u-.4)/.5));
    const re=.35*fl; top.intensity*=1-.85*ease.outCubic(prog(t,T.end,.6)); B.set(t,sp*(1-.8*ease.outCubic(prog(t,T.end,.6))));
    glassMat.emissiveIntensity=.45*re*2; filMat.color.setRGB(Math.min(1,re*2.6),Math.min(1,re*1.6),re*.7); fil.visible=re>.004; halo.material.uniforms.k.value=.22*re; lamp.intensity=4.4*re*.6;}
  scene.environmentIntensity=0;
  // カメラ
  const [p,l]=camAt(t);camera.position.copy(p);camera.lookAt(l);
  if(S.bokeh){
    const fNear=camera.position.distanceTo(V(0,1.88,1.35)), fFar=camera.position.distanceTo(V(0,2.5,-1.5));
    const r=ease.inOutSine(prog(t,3.2,3.2))*(1-ease.inOutSine(prog(t,T.end,1.0)));
    S.bokeh.uniforms.focus.value=lerp(fNear,fFar,r);
    S.bokeh.uniforms.aperture.value=t<T.end?lerp(.0045,.0011,r):lerp(.0011,.0022,ease.inOutSine(prog(t,T.end,1.0)));
  }
  // テロップ
  capFade($('c1'),t,2.322,4.55);capFade($('c2'),t,4.667,6.70);
  capFade($('title'),t,T.title,99,30);capFade($('sub'),t,T.sub,99,12);capFade($('note'),t,11.714,99,8);
  S.render();
};
</script></body></html>
