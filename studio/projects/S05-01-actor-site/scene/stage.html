<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// 空の舞台：黒い床にT字の蓄光バミリ（役者の立ち位置）。t<1 は暗転（蓄光だけ）、t>=1 は真上スポットが立ち位置に落ちる
import * as C from '/tools/cine/cine.js';
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:W>H?24:34,envIntensity:0});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=.9;S.bloom.strength=.12;S.bloom.radius=.4;}
scene.background=new THREE.Color(0);scene.fog=new THREE.FogExp2(0,.035);
// 黒い舞台床：板目と擦れ（canvas で作る。色はほぼ黒、粗さにムラ）
function floorTex(){const c=document.createElement('canvas');c.width=c.height=2048;const x=c.getContext('2d');
  x.fillStyle='#808080';x.fillRect(0,0,2048,2048);
  for(let i=0;i<16;i++){x.fillStyle=`rgb(${118+Math.random()*20|0},${118+Math.random()*20|0},${118+Math.random()*20|0})`;x.fillRect(i*128,0,127,2048);x.fillStyle='#5a5a5a';x.fillRect(i*128+127,0,1,2048);}
  for(let i=0;i<9000;i++){const a=Math.random()*Math.PI*2,l=4+Math.random()*60;x.strokeStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()*.06})`;
    const px=Math.random()*2048,py=Math.random()*2048;x.lineWidth=.5+Math.random()*1.5;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l*.3);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(16,16);t.anisotropy=8;return t;}
const rt=floorTex();
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x3a3530,map:rt,roughness:.5,roughnessMap:rt,metalness:0,bumpMap:rt,bumpScale:.6}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// 古いバミリの跡（剥がした跡の薄い四角）を数か所
const ghost=new THREE.MeshStandardMaterial({color:0x1d1c1a,roughness:.5,transparent:true,opacity:.55});
[[-1.3,.6,.4],[1.6,-.9,-.3],[.9,1.4,.9],[-2.2,-1.6,.2]].forEach(([x,z,r])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(.05,.22),ghost);m.rotation.set(-Math.PI/2,0,r);m.position.set(x,.001,z);scene.add(m);});
// 蓄光テープのT字（幅 2.5cm、長さ 20cm）
const lum=new THREE.MeshStandardMaterial({color:0xd8e8cf,roughness:.6,emissive:0x8cff9c,emissiveIntensity:0});
const T=new THREE.Group();
const a=new THREE.Mesh(new THREE.BoxGeometry(.2,.0015,.025),lum),b=new THREE.Mesh(new THREE.BoxGeometry(.025,.0015,.12),lum);
b.position.z=.0725;T.add(a,b);T.position.set(0,.001,.15);T.rotation.y=.04;scene.add(T);
const top=C.spot(scene,{pos:[0,7,.6],target:[0,0,.15],color:0xffe2bd,intensity:0,angle:.13,penumbra:.55});
const B=C.beam(scene,{from:[0,7,.6],to:[0,0,.15],radius:.9,color:0xffe2bd,density:.18});
const desk=W>H;
window.__ready=Promise.resolve();
window.renderAt=t=>{
  const lit=t>=1?1:0;
  top.intensity=520*lit;B.set(t,lit);
  lum.emissiveIntensity=lit?.25:1.15;
  if(desk){camera.position.set(0,1.9,6.4);camera.lookAt(0,.75,0);}else{camera.position.set(0,1.8,5.6);camera.lookAt(0,.8,0);}
  if(S.bokeh){S.bokeh.uniforms.focus.value=camera.position.distanceTo(new THREE.Vector3(0,0,.15));S.bokeh.uniforms.aperture.value=.0006;}
  S.render();
};
</script></body></html>
