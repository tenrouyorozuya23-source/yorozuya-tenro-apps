<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>S06-04 hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#ov{position:absolute;inset:0;color:#efe9df;pointer-events:none;font-family:"Noto Sans JP"}
.t{position:absolute;opacity:0}
#place{left:120px;top:100px;font:300 40px/1 "Noto Sans JP";letter-spacing:.2em}
#title{left:0;right:0;top:120px;text-align:center;font:600 72px/1 "Shippori Mincho";letter-spacing:.2em;text-indent:.2em}
#co{left:0;right:0;top:220px;text-align:center;font:300 30px/1 "Noto Sans JP";letter-spacing:.34em;text-indent:.34em;color:#bdb5a8}
#note{right:130px;bottom:70px;font:400 26px/1 "Noto Sans JP";color:#86868b}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="ov"><div class="t" id="place"></div><div class="t" id="title">灯りでお迎えする</div><div class="t" id="co">ホテル宵灯</div><div class="t" id="note">架空のホテルのサンプルです</div></div>
<script type="module">
// 白い断面模型のホテル。入口→ロビー→廊下→客室の順に、お客の歩く道に沿って灯りが点く。最後に真上から一本の光の道が見える
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:30,envIntensity:0,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=1.2;S.bloom.strength=.3;S.bloom.radius=.4;}
scene.fog=null;scene.background=new THREE.Color(0);
const wall=new THREE.MeshStandardMaterial({color:0xefebe4,roughness:.85});
const floorM=new THREE.MeshStandardMaterial({color:0xd8d2c8,roughness:.9});
const base=new THREE.Mesh(new THREE.BoxGeometry(6.4,.04,4.2),floorM);base.position.set(0,-.02,-.4);base.receiveShadow=true;scene.add(base);
const WH=.34,WT=.04;
const seg=(x1,z1,x2,z2)=>{const L=Math.hypot(x2-x1,z2-z1);const m=new THREE.Mesh(new THREE.BoxGeometry(L+WT,WH,WT),wall);m.position.set((x1+x2)/2,WH/2,(z1+z2)/2);m.rotation.y=-Math.atan2(z2-z1,x2-x1);m.castShadow=m.receiveShadow=true;scene.add(m);};
// ロビー（入口の開口つき）
seg(-2.8,-.4,-.8,-.4);seg(-2.8,-.4,-2.8,.55);seg(-2.8,.95,-2.8,1.4);seg(-2.8,1.4,-.8,1.4);seg(-.8,1.4,-.8,.2);
// 廊下（ロビーから右へ）
seg(-.8,-.4,2.8,-.4);seg(-.8,.2,1.4,.2);seg(1.9,.2,2.8,.2);
// 客室（廊下の下手）と隣の部屋
seg(1.4,.2,1.4,1.6);seg(2.8,.2,2.8,1.6);seg(1.4,1.6,2.8,1.6);seg(1.0,.2,1.0,1.6);seg(-.8,1.6,1.0,1.6);
// 廊下の上手の部屋の並び
for(let i=0;i<4;i++)seg(-.4+i*.8,-.4,-.4+i*.8,-1.8);seg(-.8,-1.8,2.8,-1.8);
// 家具の箱（ロビーのソファ・受付・客室のベッド）
const box=(w,h,d,x,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wall);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);};
box(.7,.12,.22,-1.4,-.15);box(.5,.08,.25,-2.2,.1);box(.25,.08,.25,-1.7,.9);box(.6,.07,.8,2.25,1.15);box(.3,.12,.18,1.75,1.4);
// 灯り：道に沿った点光源と床の光だまり
const PATH=[[-3.2,.75],[-2.45,.75],[-1.9,.45],[-1.3,.1],[-.5,-.1],[.2,-.1],[.9,-.1],[1.65,-.1],[1.65,.5],[2.1,1.0]];
const pc=document.createElement('canvas');pc.width=pc.height=128;{const x=pc.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.5,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);}
const pt=new THREE.CanvasTexture(pc);
const lamps=PATH.map(([x,z],i)=>{const last=i===PATH.length-1;
  const l=new THREE.PointLight(0xffb873,0,last?2.0:1.1,2);l.position.set(x,last?.5:.28,z);l.castShadow=last;scene.add(l);
  const pool=new THREE.Mesh(new THREE.PlaneGeometry(last?1.4:.7,last?1.4:.7),new THREE.MeshBasicMaterial({map:pt,color:0xffb36a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  pool.rotation.x=-Math.PI/2;pool.position.set(x,.003,z);scene.add(pool);return {l,pool,last};});
const sky=new THREE.HemisphereLight(0x6f86b8,0x0a0807,.35);scene.add(sky);
const TL=PATH.map((_,i)=>i===0?0:(i<PATH.length-1?3.0+(i-1)*1.65:18.0));
const $=id=>document.getElementById(id);
const PL=['入口','ロビー','ロビー','ロビー','廊下','廊下','廊下','廊下','客室','客室'];
window.__ready=document.fonts.ready;
window.renderAt=t=>{
  const sil=t>=17.25&&t<18;
  lamps.forEach((m,i)=>{let v=t>=TL[i]?1:0;if(sil)v*=.3;if(t>=26.25&&t<27)v*=.7;
    m.l.intensity=(m.last?1.6:.55)*v;m.pool.material.opacity=(m.last?.75:.5)*v;});
  sky.intensity=.35*(1-.6*prog(t,2,8));
  // カメラ：低い斜めから道を追う → 18秒の客室で寄る → 20.5秒から真上へ
  const n=TL.filter(x=>t>=x).length-1, k=Math.max(0,Math.min(PATH.length-1,n));
  const f=n<0?0:ease.inOutSine(prog(t,TL[k],1.0));
  const a=PATH[Math.max(0,k-1)],b=PATH[k];const fx=n<=0?PATH[0][0]:lerp(a[0],b[0],f),fz=n<=0?PATH[0][1]:lerp(a[1],b[1],f);
  const u=ease.inOutSine(prog(t,20.5,4));
  const cx=lerp(fx-.8,0,u),cy=lerp(1.25,10.2,u),cz=lerp(fz+2.4,1.4,u),lx=lerp(fx+.3,-.2,u),lz=lerp(fz,-.05,u);
  const ap=1-ease.outCubic(prog(t,0,3.2));camera.position.set(cx+.05*Math.sin(t*.7)-.6*ap,cy+.35*ap,cz-.2*prog(t,25,5)+1.0*ap);camera.lookAt(lx,0,lz);
  if(S.bokeh){S.bokeh.uniforms.focus.value=Math.hypot(cx-lx,cy,cz-lz);S.bokeh.uniforms.aperture.value=lerp(.0012,.0004,u);}
  if(n>=0&&t<20.5){let g=k;while(g>0&&PL[g-1]===PL[k])g--;$('place').textContent=PL[k];$('place').style.opacity=(ease.outCubic(prog(t,TL[g],.3))*(1-prog(t,20.2,.3))).toFixed(3);}else $('place').style.opacity=0;
  $('title').style.opacity=ease.outCubic(prog(t,27,.5)).toFixed(3);$('co').style.opacity=ease.outCubic(prog(t,27.4,.5)).toFixed(3);
  $('note').style.opacity=ease.outCubic(prog(t,25,.5)).toFixed(3);
  S.render();
};
</script></body></html>
