<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>S03-06 member colors</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400&display=block" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#ov{position:absolute;inset:0;color:#efe9df;pointer-events:none;font-family:"Noto Sans JP"}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0}
#grp{top:300px;font:600 96px/1 "Shippori Mincho";letter-spacing:.2em;text-indent:.2em}
#grpsub{top:420px;font:300 40px/1 "Noto Sans JP";letter-spacing:.3em;text-indent:.3em;color:#a69d90}
#col{top:300px;font:300 48px/1 "Noto Sans JP";letter-spacing:.2em;text-indent:.2em}
#note{top:1480px;font:400 28px/1 "Noto Sans JP";color:#6e6e73}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="ov"><div class="t" id="grp">六花ノ灯</div><div class="t" id="grpsub">MEMBER COLOR</div><div class="t" id="col"></div><div class="t" id="note">架空のグループのサンプルです</div></div>
<script type="module">
// メンバーカラーを「光の色」だけで出す。1人1色のスポットが拍で灯り、カメラが横に移る。最後は全員を白い光で
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const M=[["雪村 しずく","白藍",0x9fc4e8],["春日 もも","桜",0xf2a7b8],["若葉 ゆい","若葉",0xa9d98a],["柚月 ひなた","山吹",0xf2c14e],["藤咲 あや","藤",0xb79ae0],["緋山 ほのか","緋",0xf0715a]];
const T0=1.5, SL=1.5, FIN=T0+SL*M.length, STAB=13.5, GAP=.72;
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:30,envIntensity:0,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=2;S.bloom.strength=0;}
scene.fog=new THREE.FogExp2(0,.025);scene.background=new THREE.Color(0);
C.stageFloor(scene,{material:new THREE.MeshStandardMaterial({color:0x0b0a09,roughness:.85})});
const X=i=>(i-(M.length-1)/2)*GAP;
const planes=[],spots=[],beams=[];
async function build(){
  await document.fonts.load('600 400px "Shippori Mincho"',M.map(m=>m[0]).join(''));
  M.forEach(([name,,col],i)=>{
    const cv=document.createElement('canvas');const chars=[...name.replace(/\s/g,'')];
    const fs=420,gap=40;cv.width=560;cv.height=chars.length*(fs+gap)+gap;
    const x=cv.getContext('2d');x.fillStyle='#fff';x.font=`600 ${fs}px "Shippori Mincho"`;x.textAlign='center';x.textBaseline='middle';
    chars.forEach((ch,j)=>x.fillText(ch,cv.width/2,gap+fs/2+j*(fs+gap)));
    const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
    const h=Math.min(1.25,.26*chars.length), w=h*cv.width/cv.height;
    const mat=new THREE.MeshStandardMaterial({color:0xece4d6,map:tex,alphaMap:tex,alphaTest:.5,roughness:.6,side:THREE.DoubleSide});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);p.position.set(X(i),h/2+.003,0);scene.add(p);planes.push(p);
    const sc=document.createElement('canvas');sc.width=256;sc.height=64;const sx=sc.getContext('2d');
    const g=sx.createRadialGradient(128,32,0,128,32,128);g.addColorStop(0,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');
    sx.setTransform(1,0,0,.25,0,24);sx.fillStyle=g;sx.fillRect(0,0,256,256);
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(w*1.25,.14),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
    sh.rotation.x=-Math.PI/2;sh.position.set(X(i),.002,.02);scene.add(sh);
    const pos=[X(i),6.4,1.6];
    spots.push(C.spot(scene,{pos,target:[X(i),0,-.2],color:col,intensity:0,angle:.12,penumbra:.6,shadow:false}));
    beams.push(C.beam(scene,{from:pos,to:[X(i),0,-.2],radius:.42,color:col,density:.16}));
  });
}
window.__ready=build();
const $=id=>document.getElementById(id);
const white=new THREE.Color(0xffe6c8);
const introSpot=C.spot(scene,{pos:[0,6.4,3.2],target:[0,0,1.1],color:0xffe6c8,intensity:0,angle:.16,penumbra:.7,shadow:false});
const introBeam=C.beam(scene,{from:[0,6.4,3.2],to:[0,0,1.1],radius:.6,color:0xffe6c8,density:.16});
window.renderAt=t=>{
  const cur=Math.floor((t-T0)/SL), fin=ease.inOutSine(prog(t,FIN,1.2));
  // カメラ：イントロは全体を引きで暗く → 拍ごとに横移動（0.35秒で移って止まる）→ 最後に引く
  let cx=X(0), d=5.6;
  if(t<T0){cx=0;d=lerp(9.0,8.2,prog(t,0,T0));}
  else if(t<FIN){const k=Math.min(cur,M.length-1), mv=ease.outCubic(prog(t,T0+k*SL,.35));cx=lerp(k?X(k-1):0,X(k),mv);d=lerp(k?5.4:8.2,5.4,k?1:mv)-.45*prog(t,T0+k*SL,SL);}
  else{cx=lerp(X(M.length-1),0,fin)+.04*Math.sin(t*.8);d=lerp(4.95,16.8,fin)-.25*prog(t,FIN+1.2,3);}
  const cy=t<FIN?1.05:lerp(1.05,2.2,fin);
  camera.position.set(cx,cy,d);camera.lookAt(cx,t<FIN?.78:lerp(.78,.55,fin),0);
  if(S.bokeh){S.bokeh.uniforms.focus.value=d;S.bokeh.uniforms.aperture.value=.0012;}
  M.forEach(([,, col],i)=>{
    const on=t>=T0+i*SL?1:0;
    const active=t<FIN?(i===cur?1:0):(t>=FIN+.375*i+.375?1:0);
    const k=on*active*(t<FIN?Math.min(1,.55+.45*prog(t,T0+i*SL,.05)):1);
    const c=new THREE.Color(col);
    spots[i].color.copy(c);beams[i].mesh.material.uniforms.color.value.copy(c);
    spots[i].intensity=(t<FIN?720:620)*k;beams[i].set(t,k*(t>=FIN?.85:1));
    planes[i]&&planes[i].material.color.setHex(0xece4d6).multiplyScalar(t<T0?.06:(t<FIN?(i===cur?1:.1):(t>=FIN+.375*i+.375?1:.1)));
  });
  const ik=1-prog(t,T0-.05,.05);introSpot.intensity=520*ik;introBeam.set(t,ik);
  const f=(el,a,b,dur=.4)=>{el.style.opacity=(ease.outCubic(prog(t,a,dur))*(1-prog(t,b,.25))).toFixed(3)};
  f($('grp'),-1,T0-.15,.01);f($('grpsub'),.25,T0-.15,.3);
  if(t>=T0&&t<FIN){const m=M[cur];$('col').textContent=`${m[1]}　${m[0].split(' ')[1]}`;$('col').style.color='#'+new THREE.Color(m[2]).lerp(new THREE.Color(0xffffff),.35).getHexString();
    $('col').style.opacity=(ease.outCubic(prog(t,T0+cur*SL+.1,.25))*(1-prog(t,T0+cur*SL+SL-.18,.15))).toFixed(3);}else $('col').style.opacity=0;
  if(t>=STAB-.05){$('grp').style.opacity=ease.outCubic(prog(t,STAB,.3));$('grpsub').style.opacity=0;}
  f($('note'),STAB+.2,99,.5);
  S.render();
};
</script></body></html>
