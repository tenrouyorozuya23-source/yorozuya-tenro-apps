<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Noto+Sans+JP:wght@300;400&display=block" rel="stylesheet">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><style>
#ov{position:absolute;inset:0;color:#f3ece1;pointer-events:none}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0}
#show{top:300px;font:400 36px/1 "Noto Sans JP";letter-spacing:.3em;text-indent:.3em;color:#d8cebf}
#title{top:360px;font:600 120px/1.15 "Shippori Mincho";letter-spacing:.1em;text-indent:.1em}
#date{top:530px;font:400 44px/1 "Noto Sans JP";letter-spacing:.12em;text-indent:.12em}
#venue{top:605px;font:300 30px/1.5 "Noto Sans JP";letter-spacing:.24em;text-indent:.24em;color:#b8ae9f}
#tease{top:300px;font:300 34px/1 "Noto Sans JP";letter-spacing:.5em;text-indent:.5em;color:#bdb2a2}
</style></head><body><div id="ov">
<div class="t" id="tease">千秋楽のあとに</div>
<div class="t" id="show">灯守座『硝子の庭』</div><div class="t" id="title">追加公演決定</div>
<div class="t" id="date">2026.12.21（月）19:00</div><div class="t" id="venue">港町ホール</div></div>
<script type="module">
// S01-06 追加公演決定：客席から見た緞帳の裾から光が漏れ、8.0〜9.5秒で緞帳が上がり、10.0秒の一打で舞台に光が入って告知が立つ
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease}=C;
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:36,envIntensity:0,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=1.6;S.bloom.strength=.35;}
scene.fog=new THREE.FogExp2(0x020202,.04);scene.background=new THREE.Color(0x020202);
C.stageFloor(scene,{material:new THREE.MeshPhysicalMaterial({color:0x0f0d0c,roughness:.45,clearcoat:.3,clearcoatRoughness:.35})});
// 舞台（床を一段上げる）と額縁
const dark=new THREE.MeshStandardMaterial({color:0x0b0a0a,roughness:.9});
const deck=new THREE.Mesh(new THREE.BoxGeometry(9,.7,6),new THREE.MeshPhysicalMaterial({color:0x14110f,roughness:.5,clearcoat:.3}));deck.position.set(0,.35,-3.2);deck.receiveShadow=true;scene.add(deck);
for(const sx of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(1.4,7,.6),dark);p.position.set(sx*3.6,3.5,-.4);scene.add(p);}
const top=new THREE.Mesh(new THREE.BoxGeometry(9,1.6,.6),dark);top.position.set(0,6.2,-.4);scene.add(top);
// 緞帳：縦のひだを持つ布（頂点を波打たせる）
const cg=new THREE.PlaneGeometry(6.2,5.0,240,8);{const p=cg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setZ(i,Math.sin(x*9)*.05+Math.sin(x*3.1+1)*.03);}cg.computeVertexNormals();}
const curtain=new THREE.Mesh(cg,new THREE.MeshPhysicalMaterial({color:0x7a171c,roughness:.7,sheen:1,sheenRoughness:.5,sheenColor:new THREE.Color(0xff9a8a),side:THREE.DoubleSide}));
curtain.castShadow=true;curtain.receiveShadow=true;scene.add(curtain);
const CY0=.7+.08+2.5;// 裾が舞台面の 8cm 上
// 奥の舞台：硝子の林（S01 シリーズの舞台）
const R=C.rand(7);const gc=document.createElement('canvas');gc.width=8;gc.height=256;{const x=gc.getContext('2d');const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.55,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,1)');x.fillStyle=g;x.fillRect(0,0,8,256);}
const glassMat=new THREE.MeshStandardMaterial({color:0xc2d0da,roughness:.15,transparent:true,opacity:.09,alphaMap:new THREE.CanvasTexture(gc),depthWrite:false,side:THREE.DoubleSide});
for(let i=0;i<24;i++){const h=1.4+R()*2.4,w=.16+R()*.24;const x=(R()-.5)*5.4,z=-2.2-R()*3;const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.015),glassMat);m.position.set(x,.7+h/2,z);m.rotation.y=(R()-.5)*.9;scene.add(m);}
// 客席：手前の座席の背のシルエット（2列）
const seatM=new THREE.MeshStandardMaterial({color:0x060404,roughness:.9});
for(let row=0;row<2;row++)for(let i=-6;i<=6;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.5,.62,.12),seatM);s.position.set(i*.56+(row%2)*.28,.55,4.6+row*1.0);scene.add(s);
  const tp=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.5,12),seatM);tp.rotation.z=Math.PI/2;tp.position.set(s.position.x,.86,s.position.z);scene.add(tp);}
// 光：緞帳の裏から裾の下へ漏れる光、舞台の上からの光、奥のバック
const leak=C.spot(scene,{pos:[0,.78,-.9],target:[0,.7,3],color:0xffd3a0,intensity:0,angle:1.2,penumbra:.8,shadow:false});
const stripM=new THREE.MeshBasicMaterial({color:new THREE.Color(0xffd9a8),transparent:true,opacity:1});const strip=new THREE.Mesh(new THREE.PlaneGeometry(6.0,.028),stripM);strip.position.set(0,.74,-.32);scene.add(strip);
const foh=C.spot(scene,{pos:[0,3.8,10],target:[0,1.6,-.3],color:0xffb48a,intensity:0,angle:.19,penumbra:1,shadow:false});
const keyL=C.spot(scene,{pos:[-2.2,6,1.2],target:[0,.8,-2.6],color:0xffe0bd,intensity:0,angle:.5,penumbra:.6});
const keyR=C.spot(scene,{pos:[2.2,6,1.2],target:[0,.8,-2.6],color:0xffe9d4,intensity:0,angle:.5,penumbra:.6});
const back=C.spot(scene,{pos:[0,5,-7],target:[0,.7,-3],color:0xb9cbe6,intensity:0,angle:.6,penumbra:.8,shadow:false});
const bmL=C.beam(scene,{from:[-2.2,6,1.2],to:[-.4,.7,-2.4],radius:1.1,color:0xffe0bd,density:.08});
const bmR=C.beam(scene,{from:[2.2,6,1.2],to:[.4,.7,-2.4],radius:1.1,color:0xffe9d4,density:.08});
await document.fonts.load('600 120px "Shippori Mincho"','追加公演決定');await document.fonts.load('400 44px "Noto Sans JP"','灯守座『硝子の庭』2026.12.21（月）19:00港町ホール千秋楽のあとに');
window.__ready=Promise.resolve();
const $=id=>document.getElementById(id);const op=(id,v)=>$(id).style.opacity=(+v).toFixed(3);
const UP0=8.0,UP1=9.5,HIT=10.0;
window.renderAt=t=>{
  // 裾の光：0秒から見え、拍に合わせて少し息をする。2.0秒の一打で一段明るく
  const breath=1+.12*Math.cos(t*Math.PI);
  const lv=(t<2?.5:t<UP0?lerp(.75,1,prog(t,2,6)):lerp(1,0,prog(t,UP1,.4)))*breath;leak.intensity=0;stripM.color.setRGB(1*lv*1.5,.85*lv*1.5,.66*lv*1.5);strip.visible=t<UP1+.15;foh.intensity=t<UP1?lerp(420,520,prog(t,0,8)):lerp(520,0,prog(t,UP1,.3));
  // 緞帳：8.0〜9.5秒で上がる
  const u=ease.inOutCubic(prog(t,UP0,UP1-UP0));curtain.position.set(0,CY0+u*5.2,-.25);
  // 9.5〜10.0は上がりきった舞台がほぼ暗い。10.0の一打で灯る
  const lit=t>=HIT;const k=lit?ease.outCubic(prog(t,HIT,.15)):0;
  keyL.intensity=k*150;keyR.intensity=k*135;back.intensity=lit?60:(t>=UP0?18*u:0);bmL.set(t,k*.9);bmR.set(t,k*.9);
  // カメラ：客席の後方から舞台へゆっくり寄る（止まらない）。明転後は少しだけ上を見る
  const d=lerp(7.6,5.9,.4*prog(t,0,15)+.6*ease.inOutSine(prog(t,0,15)));
  camera.position.set(lerp(-.25,.2,prog(t,0,15)),lerp(1.05,1.25,prog(t,0,15)),d);camera.lookAt(0,lerp(1.75,2.25,ease.inOutSine(prog(t,UP0,4))),-1.5);
  if(S.bokeh){S.bokeh.uniforms.focus.value=d+.6;S.bokeh.uniforms.aperture.value=.0008;}
  op('tease',t<UP0?ease.outCubic(prog(t,.2,.4))*(1-prog(t,7.6,.4)):0);
  op('title',lit?ease.outCubic(prog(t,HIT,.15)):0);op('show',lit?ease.outCubic(prog(t,HIT+.4,.3)):0);
  op('date',lit?ease.outCubic(prog(t,HIT+.8,.3)):0);op('venue',lit?ease.outCubic(prog(t,HIT+1.1,.3)):0);
  S.render();
};
</script></body></html>
