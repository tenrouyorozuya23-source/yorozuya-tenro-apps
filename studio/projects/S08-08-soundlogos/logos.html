<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=block" rel="stylesheet">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><style>
#ov{position:absolute;inset:0;color:#e9e2d6;pointer-events:none;font-family:"Noto Sans JP"}
#cap{position:absolute;left:110px;bottom:84px;font:400 26px/1.4 "Noto Sans JP";letter-spacing:.14em;color:#b9b0a3;opacity:0}
#cap b{font:500 26px "Noto Sans JP";color:#e9e2d6;margin-right:1.2em;letter-spacing:.1em}
#ttl{position:absolute;right:110px;bottom:84px;font:400 26px/1.4 "Noto Sans JP";letter-spacing:.14em;color:#b9b0a3;opacity:0}
</style></head><body><div id="ov"><div id="cap"></div><div id="ttl">サウンドロゴ集　天狼スタジオ</div></div>
<script type="module">
// S08-08 サウンドロゴ集：架空の10社。各 4.5 秒、0.5 秒の一打で光と音をそろえる（facts.json）
import * as C from '/tools/cine/cine.js';
const {lerp,prog,ease,clamp}=C;
const facts=await (await fetch('/projects/S08-08-soundlogos/facts.json')).json();
const SLOT=facts.slot_sec, HIT=facts.hit_sec, CO=facts.companies;
const W=innerWidth,H=innerHeight;
const S=C.createStage({width:W,height:H,exposure:1.0,fov:28,envIntensity:0,dof:true});
const {THREE,scene,camera}=S;
if(S.bloom){S.bloom.threshold=.95;S.bloom.strength=.35;S.bloom.radius=.4;}
scene.background=new THREE.Color(0x030303);scene.fog=new THREE.FogExp2(0x030303,.02);
await document.fonts.load('600 200px "Shippori Mincho"',CO.map(c=>c.name+c.kind).join(''));
await document.fonts.load('600 200px "Cormorant Garamond"','Maison YūgureSirius AcousticsHoshimi OpticsLune AtelierAtelier Kasumi');
await document.fonts.load('400 40px "Noto Sans JP"','精密加工メーカーホテル総合商社フレグランスオーディオ文具光学メーカーコスメ建築設計事務所IT 企業架空の企業サウンドロゴ集天狼スタジオ');
// 社ごとの見た目：板の素材・光の色・光の動き・カメラの向き
const ST=[
 {mat:'metal', col:0xdfe8ff, move:'scan',  yaw:-.18, bg:'#1a1c20', fg:'#d9dde4', font:'jp'},
 {mat:'paper', col:0xffc98a, move:'moon',  yaw:.12,  bg:'#13151c', fg:'#efe6d6', font:'jp'},
 {mat:'gloss', col:0xffa15a, move:'dawn',  yaw:0,    bg:'#151110', fg:'#f3e7d6', font:'jp'},
 {mat:'gloss', col:0xffb98a, move:'dusk',  yaw:-.1,  bg:'#17121a', fg:'#f1e4dc', font:'en'},
 {mat:'metal', col:0xf4f6ff, move:'pulse', yaw:.16,  bg:'#121316', fg:'#e6e9f0', font:'en'},
 {mat:'paper', col:0xffd8a8, move:'rake',  yaw:-.22, bg:'#e9e2d4', fg:'#1a1714', font:'jp', light:true},
 {mat:'metal', col:0xeef3ff, move:'iris',  yaw:.08,  bg:'#101113', fg:'#e8ebf0', font:'en'},
 {mat:'gloss', col:0xffe1d2, move:'glint', yaw:-.08, bg:'#1b1416', fg:'#f4e8e2', font:'en'},
 {mat:'paper', col:0xfff0d8, move:'sun',   yaw:.2,   bg:'#d8d3ca', fg:'#26231f', font:'en', light:true},
 {mat:'gloss', col:0xcfe0ff, move:'dots',  yaw:-.14, bg:'#0f1218', fg:'#e4ebf6', font:'jp'}];
function plateTex(c,st){
  const cv=document.createElement('canvas');cv.width=2048;cv.height=1024;const g=cv.getContext('2d');
  g.fillStyle=st.bg;g.fillRect(0,0,2048,1024);
  if(st.mat==='metal'){for(let i=0;i<1400;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.025})`;g.fillRect(0,Math.random()*1024,2048,1);}}
  if(st.mat==='paper'){const r=C.rand(5);for(let i=0;i<9000;i++){g.fillStyle=`rgba(${st.light?'0,0,0':'255,255,255'},${r()*.04})`;g.fillRect(r()*2048,r()*1024,2,2);}}
  g.fillStyle=st.fg;g.textAlign='center';g.textBaseline='middle';
  const big=st.font==='jp'?'600 '+(c.name.length>6?150:190)+'px "Shippori Mincho"':'600 '+(c.name.length>13?168:190)+'px "Cormorant Garamond"';
  g.font=big;g.letterSpacing=st.font==='jp'?'24px':'10px';g.fillText(c.name,1024,470);
  g.font='400 44px "Noto Sans JP"';g.letterSpacing='14px';g.globalAlpha=.75;g.fillText(c.kind,1024,650);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const plates=CO.map((c,i)=>{const st=ST[i];
  const m=new THREE.MeshPhysicalMaterial({map:plateTex(c,st),roughness:st.mat==='metal'?.5:st.mat==='paper'?.92:.55,metalness:st.mat==='metal'?.55:0,clearcoat:st.mat==='gloss'?.35:0,clearcoatRoughness:.55});
  const p=new THREE.Mesh(new THREE.BoxGeometry(8,4,.12),[0,0,0,0,m,0].map(x=>x||new THREE.MeshStandardMaterial({color:0x111111,roughness:.6})));
  p.receiveShadow=true;p.visible=false;scene.add(p);return p;});
const key=C.spot(scene,{pos:[0,0,8],target:[0,0,0],color:0xffffff,intensity:0,angle:.4,penumbra:.6,shadow:false});
const fill=new THREE.AmbientLight(0xffffff,0);scene.add(fill);
const dots=[0,1,2,3].map(k=>C.spot(scene,{pos:[-2.4+k*1.6,1.5,6],target:[-2.4+k*1.6,.1,0],color:0xcfe0ff,intensity:0,angle:.12,penumbra:.5,shadow:false}));
const $=id=>document.getElementById(id);
window.__ready=Promise.resolve();
const step=u=>u>=0?1:0;
window.renderAt=t=>{
  const k=Math.min(9,Math.floor(t/SLOT)), u=t-k*SLOT, st=ST[k], c=CO[k];
  plates.forEach((p,i)=>p.visible=i===k);
  const hit=u>=HIT?1:0, a=1-Math.pow(1-prog(u,HIT,2/30),3);           // 一打で2フレームで点く
  const tail=1-.35*ease.inOutSine(prog(u,SLOT-.6,.6));                      // 枠の終わりで落とす（真っ黒にはしない）
  const pre=ease.inOutSine(prog(u,0,HIT));
  key.color.set(st.col);dots.forEach(d=>d.intensity=0);
  let I=0,ang=.42,px=0,py=3.2,pz=8,tx=0,ty=0;
  switch(st.move){
   case 'scan': py=2.4; ang=hit?lerp(.1,.42,ease.outCubic(prog(u,HIT,.5))):.1; px=hit?0:lerp(-4,0,pre); tx=px; I=hit?260:120; break;
   case 'moon': py=hit?2.2:lerp(-2,2.2,pre); pz=7; ty=hit?.2:lerp(-1,.2,pre); I=hit?240:60*pre; ang=.5; break;
   case 'dawn': py=lerp(-3.5,-.6,pre)+(hit?lerp(0,1.8,ease.outCubic(prog(u,HIT,1.6))):0); pz=6.5; I=hit?280:90*pre; ang=.55; key.color.lerpColors(new THREE.Color(0xff7a3a),new THREE.Color(0xffd6a8),ease.outCubic(prog(u,HIT,1.6))); break;
   case 'dusk': px=lerp(3,1.2,ease.inOutSine(prog(u,0,SLOT))); py=1; I=hit?250:50*pre; ang=.5; break;
   case 'pulse': py=3; ang=hit?lerp(.03,.46,1-Math.pow(1-prog(u,HIT,.35),4)):.12+.03*Math.sin(u*25)*pre; I=hit?270:180; break;
   case 'rake': px=-7.5; py=.4; pz=2.6; tx=1.5; I=hit?120:20*pre; ang=.6; break;
   case 'iris': py=3; ang=hit?lerp(.1,.44,1-Math.pow(1-prog(u,HIT,.45),3)):.1; I=hit?280:200; break;
   case 'glint': px=lerp(-5,5,ease.inOutSine(prog(u,HIT-.2,2.2))); py=lerp(3,-1,ease.inOutSine(prog(u,HIT-.2,2.2))); I=hit?120:40*pre; ang=.35; break;
   case 'sun': px=lerp(6.5,4.5,prog(u,0,SLOT)); py=2.5; pz=3.6; tx=-1; I=hit?130:25*pre; ang=.6; break;
   case 'dots': I=hit?lerp(0,240,ease.outCubic(prog(u,HIT+.25,.35))):0; ang=.5;
     dots.forEach((d,j)=>d.intensity=u>=HIT+j*.125?150*(1-.7*ease.outCubic(prog(u,HIT+.6,.6))):0); break;
  }
  if(!hit){const Ih={scan:260,moon:240,dawn:280,dusk:250,pulse:270,rake:120,iris:280,glint:120,sun:130,dots:150}[st.move];I=Math.max(I,Ih*.3);if(st.move==='dots'){I=Ih*.3;ang=.5;}}
  key.penumbra=st.light?.95:.6;key.position.set(px,py,pz);key.target.position.set(tx,ty,0);key.angle=ang;
  key.intensity=I*(hit?lerp(.0,1,a)+(1-a)*0:1)*tail*(hit?1:1);
  if(hit&&a<1&&st.move!=='dots')key.intensity=lerp(I*.35,I,a)*tail;
  // 一打の直後に光をわずかに越えさせて戻す
  key.intensity*=1+.25*Math.exp(-Math.max(0,u-HIT)*6)*hit;
  fill.intensity=(st.light?.4:3.0)*(hit?lerp(1,.6,ease.outCubic(prog(u,HIT,.6))):1)+.08*Math.sin(u*2.4);
  // カメラ：社ごとに向きを変え、枠のあいだずっと少し寄り続ける
  const yaw=st.yaw+lerp(.03,-.03,prog(u,0,SLOT)), d=lerp(12.6,11.8,ease.inOutSine(prog(u,0,SLOT)));
  camera.position.set(Math.sin(yaw)*d,lerp(.25,.05,prog(u,0,SLOT)),Math.cos(yaw)*d);camera.lookAt(0,0,0);
  if(S.bokeh){S.bokeh.uniforms.focus.value=d;S.bokeh.uniforms.aperture.value=.0002;}
  $('cap').innerHTML=`<b>${String(k+1).padStart(2,'0')} / 10</b>架空の企業「${c.name}」のサウンドロゴ見本`;
  const cv=ease.outCubic(prog(u,HIT+.1,.3))*(1-prog(u,SLOT-.35,.25));$('cap').style.opacity=cv.toFixed(3);$('ttl').style.opacity=cv.toFixed(3);
  S.render();
};
</script></body></html>
