# 家族の絆 予約システム（Google Apps Script）の自動反映・自動デプロイ
#   main に stage-booking-kizuna/ の Code.gs・HTML が入ると、Apps Script に貼り付け → Webアプリを新バージョンでデプロイ
#   → 未実行の更新処理（Code.gs の MIGRATIONS）を実行する。Actions タブの「Run workflow」から手動でも動かせる。
# 初回だけ必要な設定（README「自動デプロイ」参照）：
#   - Secret  CLASPRC_JSON      … clasp login で作られる ~/.clasprc.json の中身
#   - Variable KIZUNA_SCRIPT_ID … Apps Script の「プロジェクトの設定」にあるスクリプトID
name: deploy-kizuna-gas

on:
  push:
    branches: [main]
    paths:
      - "stage-booking-kizuna/Code.gs"
      - "stage-booking-kizuna/index.html"
      - "stage-booking-kizuna/checkin.html"
      - "stage-booking-kizuna/register.html"
      - ".github/workflows/deploy-kizuna-gas.yml"
  workflow_dispatch:

concurrency:
  group: deploy-kizuna-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ vars.KIZUNA_SCRIPT_ID }}
      # Webアプリの /exec URL に入っている ID（このデプロイを新バージョンに差し替えるので URL は変わらない）
      DEPLOYMENT_ID: AKfycbykKQ8mfdPuVXsM52TPlKU-IntZ9Z-b_gYOJvHwAVdh5f2T2OvmZDdnWUqq9HhEI7MB
    steps:
      - uses: actions/checkout@v4

      - name: 設定の確認
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Secret CLASPRC_JSON と Variable KIZUNA_SCRIPT_ID を登録してください（README「自動デプロイ」）"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: clasp の準備
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Apps Script の今のファイルを取得
        run: |
          mkdir gas && cd gas
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          ls -la

      - name: リポジトリの Code.gs・HTML で上書き
        run: |
          cd gas
          # Code.gs は Apps Script 上の名前（「コード」など）のまま上書きする：CONFIG を定義しているファイルを探す
          target=$(grep -l "^var CONFIG = {" *.js 2>/dev/null | head -n 1)
          if [ -z "$target" ]; then target="Code.js"; fi
          echo "Code.gs → $target"
          cp ../stage-booking-kizuna/Code.gs "$target"
          for f in index checkin register; do cp "../stage-booking-kizuna/$f.html" "$f.html"; done
          ls -la

      - name: Apps Script に反映
        run: cd gas && clasp push --force

      - name: Webアプリを新バージョンでデプロイ
        run: |
          cd gas
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: 未実行の更新処理を実行
        run: |
          url="https://script.google.com/macros/s/$DEPLOYMENT_ID/exec?api=migrate"
          for i in 1 2 3; do
            out=$(curl -sSL "$url" || true)
            echo "$out"
            if echo "$out" | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::更新処理の結果を確認できませんでした（Apps Script の実行ログを確認してください）"
          exit 1
